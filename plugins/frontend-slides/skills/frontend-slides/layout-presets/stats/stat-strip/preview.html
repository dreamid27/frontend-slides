<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stat Strip — stats layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   Demo defaults are grayscale placeholders only.
   =========================================== */
.slide.lp {
    --lp-bg: #f2f1ef;
    --lp-fg: #1b1b1b;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(27, 27, 27, 0.12);
    --lp-accent: #7d7d7b;
    --lp-line: rgba(27, 27, 27, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === HEADER === */
.lp-kicker {
    position: absolute;
    left: 96px;
    top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-counter {
    position: absolute;
    right: 96px;
    top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-headline {
    position: absolute;
    left: 96px;
    top: 118px;
    margin: 0;
    max-width: 1200px;
    font-family: var(--lp-font-display);
    font-size: 84px;
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-headline em {
    font-style: normal;
    color: var(--lp-accent);
}

/* === STAT TILES === */
.lp-tiles {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 460px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 64px;
}
.lp-tile {
    position: relative;
    padding-top: 36px;
}
.lp-tile::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 1px;
    background: var(--lp-line);
    transform-origin: left center;
}
.lp-tile-value {
    font-family: var(--lp-font-display);
    font-size: 136px;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.02em;
    color: var(--lp-fg);
}
.lp-tile-value .lp-unit {
    color: var(--lp-accent);
}
.lp-tile-label {
    margin-top: 24px;
    font-family: var(--lp-font-body);
    font-size: 22px;
    line-height: 1.4;
    color: var(--lp-fg-muted);
}
.lp-tile-note {
    margin-top: 20px;
    font-family: var(--lp-font-mono);
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
    opacity: 0.75;
}

/* === FOOTER === */
.lp-foot-rule {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 962px;
    height: 1px;
    background: var(--lp-line);
}
.lp-foot-left,
.lp-foot-right {
    position: absolute;
    top: 984px;
    font-family: var(--lp-font-mono);
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-foot-left { left: 96px; }
.lp-foot-right { right: 96px; }

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-fade-dim { from { opacity: 0; } to { opacity: 0.75; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-headline { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-tile:nth-child(1)::before { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both; }
.slide.active .lp-tile:nth-child(2)::before { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.60s both; }
.slide.active .lp-tile:nth-child(3)::before { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both; }
.slide.active .lp-tile:nth-child(1) .lp-tile-value { animation: lp-rise-sm 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both; }
.slide.active .lp-tile:nth-child(1) .lp-tile-label { animation: lp-rise-sm 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.53s both; }
.slide.active .lp-tile:nth-child(1) .lp-tile-note  { animation: lp-fade-dim 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.61s both; }
.slide.active .lp-tile:nth-child(2) .lp-tile-value { animation: lp-rise-sm 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.60s both; }
.slide.active .lp-tile:nth-child(2) .lp-tile-label { animation: lp-rise-sm 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.68s both; }
.slide.active .lp-tile:nth-child(2) .lp-tile-note  { animation: lp-fade-dim 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.76s both; }
.slide.active .lp-tile:nth-child(3) .lp-tile-value { animation: lp-rise-sm 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both; }
.slide.active .lp-tile:nth-child(3) .lp-tile-label { animation: lp-rise-sm 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.83s both; }
.slide.active .lp-tile:nth-child(3) .lp-tile-note  { animation: lp-fade-dim 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.91s both; }
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- header -->
            <div class="lp-kicker">Results</div>
            <div class="lp-counter">10 / 14</div>
            <h2 class="lp-headline">The quarter in <em>three numbers</em></h2>

            <!-- stat tiles -->
            <div class="lp-tiles">
                <div class="lp-tile">
                    <div class="lp-tile-value">214</div>
                    <div class="lp-tile-label">Production deployments</div>
                    <div class="lp-tile-note">Up 3.1× year over year</div>
                </div>
                <div class="lp-tile">
                    <div class="lp-tile-value">38<span class="lp-unit">ms</span></div>
                    <div class="lp-tile-label">P99 inference latency</div>
                    <div class="lp-tile-note">Down from 91ms</div>
                </div>
                <div class="lp-tile">
                    <div class="lp-tile-value">99.98<span class="lp-unit">%</span></div>
                    <div class="lp-tile-label">Platform uptime</div>
                    <div class="lp-tile-note">Trailing 12 months</div>
                </div>
            </div>

            <!-- footer -->
            <div class="lp-foot-rule"></div>
            <div class="lp-foot-left">Platform telemetry — Q2 FY26</div>
            <div class="lp-foot-right">Nodeflux</div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
