<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bar Ledger — stats layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f2f1ef;
    --lp-fg: #1b1b1b;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(27, 27, 27, 0.12);
    --lp-accent: #55554f;
    --lp-line: rgba(27, 27, 27, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === HEADER === */
.lp-kicker {
    position: absolute; left: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-counter {
    position: absolute; right: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-headline {
    position: absolute; left: 96px; top: 118px;
    margin: 0;
    font-family: var(--lp-font-display);
    font-size: 84px; font-weight: 800;
    line-height: 1.02; letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-headline em { font-style: normal; color: var(--lp-accent); }

/* === BAR ROWS ===
   Bar widths are TRUE PROPORTIONS of the max value (1240h = 100%).
   Image variant: 96×96 chips left of labels (placehold.co/192x192),
   all rows or none. */
.lp-rows {
    position: absolute; left: 96px; right: 96px; top: 400px;
}
.lp-row {
    display: grid;
    grid-template-columns: 380px 1fr 180px;
    align-items: center;
    height: 130px;
}
.lp-row-label {
    font-family: var(--lp-font-body);
    font-size: 22px;
    color: var(--lp-fg);
}
.lp-bar-track { position: relative; height: 20px; }
.lp-bar {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: color-mix(in srgb, var(--lp-fg-muted) 45%, transparent);
    transform-origin: left center;
}
/* true proportions: value / 1240 */
.lp-row.r1 .lp-bar { width: 100%; }    /* 1240 h */
.lp-row.r2 .lp-bar { width: 61.3%; }   /*  760 h */
.lp-row.r3 .lp-bar { width: 33.9%; }   /*  420 h */
.lp-row.r4 .lp-bar { width: 9.5%; }    /*  118 h */
.lp-row.is-highlight .lp-bar { background: var(--lp-accent); }
.lp-row-value {
    text-align: right;
    font-family: var(--lp-font-mono);
    font-size: 20px; letter-spacing: 0.04em;
    color: var(--lp-fg);
}
.lp-row.is-highlight .lp-row-value { color: var(--lp-accent); font-weight: 500; }

/* === FOOTER === */
.lp-foot-rule {
    position: absolute; left: 96px; right: 96px; top: 962px;
    height: 1px; background: var(--lp-line);
}
.lp-foot-left, .lp-foot-right {
    position: absolute; top: 984px;
    font-family: var(--lp-font-mono);
    font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-foot-left { left: 96px; }
.lp-foot-right { right: 96px; }

/* === CHOREOGRAPHY ===
   Bars grow to their true width — the growth is the reading moment.
   The highlighted bar lands last. */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-headline { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-row.r1 .lp-row-label, .slide.active .lp-row.r1 .lp-row-value { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.40s both; }
.slide.active .lp-row.r1 .lp-bar { animation: lp-grow 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.50s both; }
.slide.active .lp-row.r2 .lp-row-label, .slide.active .lp-row.r2 .lp-row-value { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.54s both; }
.slide.active .lp-row.r2 .lp-bar { animation: lp-grow 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.64s both; }
.slide.active .lp-row.r3 .lp-row-label, .slide.active .lp-row.r3 .lp-row-value { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.68s both; }
.slide.active .lp-row.r3 .lp-bar { animation: lp-grow 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.78s both; }
.slide.active .lp-row.r4 .lp-row-label, .slide.active .lp-row.r4 .lp-row-value { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.92s both; }
.slide.active .lp-row.r4 .lp-bar { animation: lp-grow 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.02s both; }
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.3s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- header -->
            <div class="lp-kicker">Engineering Time</div>
            <div class="lp-counter">13 / 14</div>
            <h2 class="lp-headline">Where the hours <em>went</em></h2>

            <!-- bar rows (max = 1,240 h) -->
            <div class="lp-rows">
                <div class="lp-row r1">
                    <div class="lp-row-label">Site rollout</div>
                    <div class="lp-bar-track"><div class="lp-bar"></div></div>
                    <div class="lp-row-value">1,240 h</div>
                </div>
                <div class="lp-row r2">
                    <div class="lp-row-label">Edge models</div>
                    <div class="lp-bar-track"><div class="lp-bar"></div></div>
                    <div class="lp-row-value">760 h</div>
                </div>
                <div class="lp-row r3">
                    <div class="lp-row-label">Console</div>
                    <div class="lp-bar-track"><div class="lp-bar"></div></div>
                    <div class="lp-row-value">420 h</div>
                </div>
                <div class="lp-row r4 is-highlight">
                    <div class="lp-row-label">Incident response</div>
                    <div class="lp-bar-track"><div class="lp-bar"></div></div>
                    <div class="lp-row-value">118 h</div>
                </div>
            </div>

            <!-- footer -->
            <div class="lp-foot-rule"></div>
            <div class="lp-foot-left">Time tracking — Q2 FY26</div>
            <div class="lp-foot-right">Nodeflux</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
