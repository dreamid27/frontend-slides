<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Denominator — stats layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f2f1ef;
    --lp-fg: #1b1b1b;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(27, 27, 27, 0.12);
    --lp-accent: #7d7d7b;
    --lp-line: rgba(27, 27, 27, 0.25);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === CHROME === */
.lp-kicker {
    position: absolute; left: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-counter {
    position: absolute; right: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === THE FRACTION === */
.lp-numerator {
    position: absolute; left: 96px; top: 230px;
    font-family: var(--lp-font-display);
    font-size: 320px; font-weight: 800;
    line-height: 0.85; letter-spacing: -0.03em;
    color: var(--lp-fg);
}
.lp-frac-bar {
    position: absolute; left: 96px; top: 540px;
    width: 520px; height: 4px;
    background: var(--lp-accent);
    transform-origin: left center;
}
.lp-denominator {
    position: absolute; left: 96px; top: 572px;
    font-family: var(--lp-font-mono);
    font-size: 26px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-chip {
    position: absolute; left: 96px; top: 700px;
    padding: 12px 20px;
    border: 1px solid var(--lp-line);
    font-family: var(--lp-font-mono);
    font-size: 16px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--lp-accent);
}

/* === READING COLUMN ===
   Image variant: 624×300 bordered plate at x:1200, y:300
   (placehold.co/624x300); reading then flows from y:640. */
.lp-reading {
    position: absolute; left: 1200px; right: 96px; top: 300px;
    margin: 0;
    font-family: var(--lp-font-body);
    font-size: 23px; line-height: 1.6;
    color: var(--lp-fg-muted);
}
.lp-reading em { font-style: normal; color: var(--lp-fg); }

/* === FOOTER === */
.lp-foot-rule {
    position: absolute; left: 96px; right: 96px; top: 962px;
    height: 1px; background: var(--lp-line);
}
.lp-foot-left, .lp-foot-right {
    position: absolute; top: 984px;
    font-family: var(--lp-font-mono);
    font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-foot-left { left: 96px; }
.lp-foot-right { right: 96px; }

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(64px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes lp-chip-in { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-numerator { animation: lp-rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both; }
.slide.active .lp-frac-bar { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both; }
.slide.active .lp-denominator { animation: lp-rise-sm 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both; }
.slide.active .lp-chip { animation: lp-chip-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.95s both; }
.slide.active .lp-reading { animation: lp-rise-sm 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; }
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- chrome -->
            <div class="lp-kicker">Migration</div>
            <div class="lp-counter">12 / 14</div>

            <!-- the fraction -->
            <div class="lp-numerator">38</div>
            <div class="lp-frac-bar" aria-hidden="true"></div>
            <div class="lp-denominator">Of 40 sites migrated</div>
            <div class="lp-chip">95% complete</div>

            <!-- reading -->
            <p class="lp-reading">Every production site except two now runs the new stack. <em>The remainder — Balikpapan and Sorong —</em> wait on customs-held hardware, not on us; both are scheduled for the first week of August.</p>

            <!-- footer -->
            <div class="lp-foot-rule"></div>
            <div class="lp-foot-left">Deployment tracker — 08 Jul 2026</div>
            <div class="lp-foot-right">Nodeflux</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
