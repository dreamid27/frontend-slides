<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split Ledger — opening layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   Demo defaults are grayscale placeholders only.
   =========================================== */
.slide.lp {
    --lp-bg: #f1f0ee;
    --lp-fg: #1a1a1a;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(26, 26, 26, 0.13);
    --lp-accent: #8a8a88;
    --lp-line: rgba(26, 26, 26, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === INVERTED PANEL (skin point: dual-surface systems use their alt surface) === */
.lp-panel {
    position: absolute;
    left: 0;
    top: 0;
    width: 720px;
    height: 1080px;
    background: var(--lp-fg);
    color: var(--lp-bg);
    transform-origin: left center;
    z-index: 0;
}
.lp-panel-kicker {
    position: absolute;
    left: 96px;
    top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-panel-meta {
    position: absolute;
    left: 96px;
    bottom: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 2.2;
    color: var(--lp-bg);
    opacity: 0.7;
}

/* === SEAM NUMERAL (must straddle x:720) === */
.lp-seam-numeral {
    position: absolute;
    left: 720px;
    top: 96px;
    transform: translateX(-50%);
    font-family: var(--lp-font-display);
    font-size: 300px;
    font-weight: 800;
    line-height: 1;
    color: var(--lp-accent);
    z-index: 2;
    pointer-events: none;
}

/* === RIGHT FIELD === */
.lp-title-block {
    position: absolute;
    left: 816px;
    top: 380px; /* 3-line title; use 450px for a 2-line title */
    max-width: 1000px;
    z-index: 1;
}
.lp-title {
    margin: 0;
    font-family: var(--lp-font-display);
    font-size: 150px;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-title .lp-line {
    display: block;
}
.lp-title em {
    font-style: normal;
    color: var(--lp-accent);
}
.lp-lead {
    margin: 36px 0 0;
    max-width: 560px;
    font-family: var(--lp-font-body);
    font-size: 22px;
    line-height: 1.55;
    color: var(--lp-fg-muted);
}

/* === FOOTER (right field only) === */
.lp-foot-rule {
    position: absolute;
    left: 816px;
    right: 96px;
    top: 962px;
    height: 1px;
    background: var(--lp-line);
}
.lp-counter {
    position: absolute;
    right: 96px;
    top: 984px;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-fade-dim { from { opacity: 0; } to { opacity: 0.7; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(48px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-drop { from { opacity: 0; transform: translateX(-50%) translateY(-40px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.slide.active .lp-panel { animation: lp-wipe 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-seam-numeral { animation: lp-drop 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
.slide.active .lp-title .lp-line:nth-child(1) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both; }
.slide.active .lp-title .lp-line:nth-child(2) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.57s both; }
.slide.active .lp-title .lp-line:nth-child(3) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.69s both; }
.slide.active .lp-lead { animation: lp-rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-panel-kicker,
.slide.active .lp-foot-rule,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.0s both; }
.slide.active .lp-panel-meta { animation: lp-fade-dim 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.0s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- inverted panel -->
            <div class="lp-panel">
                <div class="lp-panel-kicker">Product Strategy</div>
                <div class="lp-panel-meta">
                    Offsite Briefing<br>
                    08 Jul 2026<br>
                    Nodeflux
                </div>
            </div>

            <!-- seam numeral -->
            <div class="lp-seam-numeral" aria-hidden="true">01</div>

            <!-- right field -->
            <div class="lp-title-block">
                <h1 class="lp-title">
                    <span class="lp-line">Signal</span>
                    <span class="lp-line">over</span>
                    <span class="lp-line"><em>noise</em></span>
                </h1>
                <p class="lp-lead">Three decisions that will compound for the next five years — and what we stop doing to make room for them.</p>
            </div>

            <!-- footer -->
            <div class="lp-foot-rule"></div>
            <div class="lp-counter">01 / 12</div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
