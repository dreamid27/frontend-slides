<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spine — opening layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f2f1ef;
    --lp-fg: #1b1b1b;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(27, 27, 27, 0.12);
    --lp-accent: #7d7d7b;
    --lp-line: rgba(27, 27, 27, 0.24);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === SPINE COLUMN ===
   Image variant: x:0→600 becomes a full-height image strip; the rotated
   label sits on a scrim chip. The rule at x:600 never moves. */
.lp-spine-rule {
    position: absolute;
    left: 600px; top: 0;
    width: 1px; height: 1080px;
    background: var(--lp-line);
    transform-origin: center top;
}
.lp-monogram {
    position: absolute;
    left: 0; width: 600px; top: 96px;
    text-align: center;
    font-family: var(--lp-font-display);
    font-size: 44px; font-weight: 800;
    letter-spacing: 0.04em;
    color: var(--lp-fg);
}
.lp-spine-label {
    position: absolute;
    left: 0; width: 600px; top: 540px;
    text-align: center;
    transform: rotate(-90deg);
    font-family: var(--lp-font-mono);
    font-size: 22px; font-weight: 500;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
    white-space: nowrap;
}
.lp-spine-date {
    position: absolute;
    left: 0; width: 600px; top: 984px;
    text-align: center;
    font-family: var(--lp-font-mono);
    font-size: 14px; letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === TITLE FIELD === */
.lp-kicker {
    position: absolute; left: 696px; top: 180px;
    font-family: var(--lp-font-mono);
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-title {
    position: absolute; left: 696px; top: 340px;
    margin: 0; max-width: 1030px;
    font-family: var(--lp-font-display);
    font-size: 140px; font-weight: 800;
    line-height: 0.97; letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-title .lp-line { display: block; }
.lp-title em { font-style: normal; color: var(--lp-accent); }
.lp-lead {
    position: absolute; left: 696px; top: 660px;
    margin: 0; max-width: 640px;
    font-family: var(--lp-font-body);
    font-size: 22px; line-height: 1.55;
    color: var(--lp-fg-muted);
}
.lp-counter {
    position: absolute; right: 96px; top: 984px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(48px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-draw { from { transform: scaleY(0); } to { transform: scaleY(1); } }
/* rotated label: animate opacity only — a transform animation would
   override its rotate() */
.slide.active .lp-spine-rule { animation: lp-draw 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-monogram { animation: lp-fade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
.slide.active .lp-spine-label { animation: lp-fade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
.slide.active .lp-spine-date { animation: lp-fade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both; }
.slide.active .lp-kicker { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
.slide.active .lp-title .lp-line:nth-child(1) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
.slide.active .lp-title .lp-line:nth-child(2) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.52s both; }
.slide.active .lp-lead { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-counter { animation: lp-fade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- spine column -->
            <div class="lp-spine-rule"></div>
            <div class="lp-monogram">NF</div>
            <div class="lp-spine-label">Quarterly Review · Vol 04</div>
            <div class="lp-spine-date">08 Jul 2026</div>

            <!-- title field -->
            <div class="lp-kicker">Q2 Results &amp; Outlook</div>
            <h1 class="lp-title">
                <span class="lp-line">The quiet</span>
                <span class="lp-line"><em>quarter</em></span>
            </h1>
            <p class="lp-lead">No launches, no incidents, no drama — and the strongest numbers we have ever posted. Here is why boring worked.</p>

            <div class="lp-counter">01 / 12</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
