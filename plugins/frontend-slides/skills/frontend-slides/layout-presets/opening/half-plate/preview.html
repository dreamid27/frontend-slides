<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Half Plate — opening layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f2f1ef;
    --lp-fg: #1b1b1b;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(27, 27, 27, 0.12);
    --lp-accent: #7d7d7b;
    --lp-line: rgba(27, 27, 27, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === MEDIA PLATE (left half) ===
   Recommended image size: 960×1080 (https://placehold.co/960x1080).
   The frame is fixed and the <img> uses object-fit: cover, so any
   delivered dimensions fill it without breaking the layout. The CSS
   gradient beneath is the fallback if the image is missing or fails. */
.lp-plate {
    position: absolute;
    left: 0; top: 0;
    width: 960px; height: 1080px;
    overflow: hidden;
    background:
        radial-gradient(1100px 700px at 25% 20%, rgba(255,255,255,0.35), transparent 60%),
        radial-gradient(900px 900px at 85% 85%, rgba(0,0,0,0.28), transparent 55%),
        linear-gradient(160deg, #cfcecb 0%, #b4b3b0 45%, #8e8d8a 100%);
}
.lp-plate img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    max-width: none; max-height: none;
    object-fit: cover;
}
.lp-caption {
    position: absolute;
    left: 48px; bottom: 48px;
    padding: 10px 16px;
    background: rgba(242, 241, 239, 0.82);
    font-family: var(--lp-font-mono);
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
    z-index: 2;
}

/* === RIGHT FIELD === */
.lp-kicker {
    position: absolute;
    left: 1056px; top: 96px;
    font-family: var(--lp-font-mono);
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-title-block {
    position: absolute;
    left: 1056px; top: 296px;
    max-width: 720px;
}
.lp-accent-bar {
    width: 72px; height: 8px;
    background: var(--lp-accent);
    margin-bottom: 44px;
    transform-origin: left center;
}
.lp-title {
    margin: 0;
    font-family: var(--lp-font-display);
    font-size: 120px; font-weight: 800;
    line-height: 0.97; letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-title .lp-line { display: block; }
.lp-title em { font-style: normal; color: var(--lp-accent); }
.lp-lead {
    margin: 36px 0 0;
    max-width: 620px;
    font-family: var(--lp-font-body);
    font-size: 22px; line-height: 1.55;
    color: var(--lp-fg-muted);
}

/* === FOOTER (right half only) === */
.lp-foot-rule {
    position: absolute;
    left: 1056px; right: 96px; top: 940px;
    height: 1px; background: var(--lp-line);
}
.lp-foot-left, .lp-foot-right {
    position: absolute; top: 962px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-foot-left { left: 1056px; }
.lp-foot-right { right: 96px; }

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-settle { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: scale(1); } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(44px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.slide.active .lp-plate { animation: lp-settle 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-kicker { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both; }
.slide.active .lp-accent-bar { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
.slide.active .lp-title .lp-line:nth-child(1) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
.slide.active .lp-title .lp-line:nth-child(2) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.52s both; }
.slide.active .lp-lead { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.8s both; }
.slide.active .lp-caption,
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.95s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- media plate: swap the placeholder src for the real photo;
                 the gradient behind it is the load-failure fallback -->
            <div class="lp-plate">
                <img src="https://placehold.co/960x1080/b7b6b3/76756f" alt="Deployment site photograph">
                <div class="lp-caption">Site 07 — Tanjung Priok, June 2026</div>
            </div>

            <!-- right field -->
            <div class="lp-kicker">Deployment Review</div>
            <div class="lp-title-block">
                <div class="lp-accent-bar"></div>
                <h1 class="lp-title">
                    <span class="lp-line">Field</span>
                    <span class="lp-line"><em>notes</em></span>
                </h1>
                <p class="lp-lead">Six weeks across twelve sites — what held up, what broke, and what the next rollout inherits.</p>
            </div>

            <!-- footer -->
            <div class="lp-foot-rule"></div>
            <div class="lp-foot-left">A. Rahman — Nodeflux</div>
            <div class="lp-foot-right">01 / 12</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
