<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masthead — opening layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   Demo defaults are grayscale placeholders only.
   =========================================== */
.slide.lp {
    --lp-bg: #f2f1ef;
    --lp-fg: #1b1b1b;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(27, 27, 27, 0.12);
    --lp-accent: #7d7d7b;
    --lp-line: rgba(27, 27, 27, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === NAMEPLATE === */
.lp-nameplate {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 96px;
    margin: 0;
    font-family: var(--lp-font-display);
    font-size: 170px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    white-space: nowrap;
}
.lp-nameplate em {
    font-style: normal;
    color: var(--lp-accent);
}

/* === RULE PAIR + META ROW (skin point: system's divider vocabulary) === */
.lp-rule-thick {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 312px;
    height: 4px;
    background: var(--lp-fg);
    transform-origin: left center;
}
.lp-meta-row {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 344px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-meta-row .lp-meta-kicker {
    font-weight: 500;
    letter-spacing: 0.18em;
    color: var(--lp-accent);
}
.lp-rule-thin {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 396px;
    height: 1px;
    background: var(--lp-line);
    transform-origin: left center;
}

/* === GHOST DROP-CAP (cropped by bottom edge) === */
.lp-ghost {
    position: absolute;
    left: 48px;
    bottom: -140px;
    font-family: var(--lp-font-display);
    font-weight: 800;
    font-size: 520px;
    line-height: 0.8;
    color: transparent;
    -webkit-text-stroke: 2px var(--lp-fg-faint);
    pointer-events: none;
    z-index: 0;
}

/* === LEAD BLOCK (bottom-right counterweight) === */
.lp-lead-block {
    position: absolute;
    right: 96px;
    bottom: 200px;
    max-width: 640px;
    z-index: 1;
}
.lp-accent-bar {
    width: 48px;
    height: 6px;
    background: var(--lp-accent);
    margin-bottom: 28px;
    transform-origin: left center;
}
.lp-lead {
    margin: 0;
    font-family: var(--lp-font-body);
    font-size: 26px;
    line-height: 1.55;
    color: var(--lp-fg-muted);
}

/* === FOOTER === */
.lp-foot-rule {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 962px;
    height: 1px;
    background: var(--lp-line);
}
.lp-foot-left,
.lp-foot-right {
    position: absolute;
    top: 984px;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-foot-left { left: 96px; }
.lp-foot-right { right: 96px; }

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.slide.active .lp-nameplate { animation: lp-rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-rule-thick { animation: lp-wipe 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both; }
.slide.active .lp-rule-thin { animation: lp-wipe 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both; }
.slide.active .lp-meta-row > *:nth-child(1) { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both; }
.slide.active .lp-meta-row > *:nth-child(2) { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.63s both; }
.slide.active .lp-meta-row > *:nth-child(3) { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.71s both; }
.slide.active .lp-ghost { animation: lp-rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; }
.slide.active .lp-accent-bar { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both; }
.slide.active .lp-lead { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.0s both; }
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- nameplate -->
            <h1 class="lp-nameplate">The year <em>ahead</em></h1>

            <!-- rule pair + meta row -->
            <div class="lp-rule-thick"></div>
            <div class="lp-meta-row">
                <span class="lp-meta-kicker">Company Briefing</span>
                <span>Volume 04 — Internal</span>
                <span>08 Jul 2026</span>
            </div>
            <div class="lp-rule-thin"></div>

            <!-- ghost drop-cap -->
            <div class="lp-ghost" aria-hidden="true">N</div>

            <!-- lead block -->
            <div class="lp-lead-block">
                <div class="lp-accent-bar"></div>
                <p class="lp-lead">Everything we shipped, everything we learned, and the plan we are carrying into next year — laid out in fourteen slides.</p>
            </div>

            <!-- footer -->
            <div class="lp-foot-rule"></div>
            <div class="lp-foot-left">A. Rahman — Nodeflux</div>
            <div class="lp-foot-right">01 / 14</div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
