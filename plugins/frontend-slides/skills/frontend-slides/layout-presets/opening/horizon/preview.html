<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon — opening layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   =========================================== */
.slide.lp {
    --lp-bg: #151515;
    --lp-fg: #ececea;
    --lp-fg-muted: #969694;
    --lp-fg-faint: rgba(255, 255, 255, 0.12);
    --lp-accent: #8f8f8d;
    --lp-line: rgba(255, 255, 255, 0.28);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === CHROME === */
.lp-kicker {
    position: absolute; left: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-counter {
    position: absolute; right: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === THE HORIZON ===
   Image variant: a full-bleed image band fills y:0→560 with a bottom-up
   scrim to --lp-bg; the rule and everything below are unchanged. */
.lp-horizon {
    position: absolute;
    left: 0; right: 0; top: 560px;
    height: 1px;
    background: var(--lp-line);
    transform-origin: left center;
}
.lp-sunrise {
    position: absolute;
    left: 96px; top: 557px;
    width: 240px; height: 7px;
    background: var(--lp-accent);
    transform-origin: left center;
    z-index: 1;
}

/* === TITLE — standing on the line === */
.lp-title {
    position: absolute;
    left: 96px; bottom: 528px; /* bottom edge 8px above the rule (1080-560+8=528 with line-height trim) */
    margin: 0;
    max-width: 1728px;
    font-family: var(--lp-font-display);
    font-size: 140px; font-weight: 800;
    line-height: 0.95; letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-title em { font-style: normal; color: var(--lp-accent); }

/* === BELOW THE LINE === */
.lp-lead {
    position: absolute;
    left: 96px; top: 608px;
    margin: 0;
    max-width: 640px;
    font-family: var(--lp-font-body);
    font-size: 23px; line-height: 1.55;
    color: var(--lp-fg-muted);
}
.lp-meta {
    position: absolute;
    right: 96px; top: 608px;
    text-align: right;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 2;
    color: var(--lp-fg-muted);
}

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(56px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.slide.active .lp-horizon { animation: lp-wipe 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-sunrise { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both; }
.slide.active .lp-title { animation: lp-rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
.slide.active .lp-lead { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both; }
.slide.active .lp-meta { animation: lp-fade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both; }
.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.95s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- chrome -->
            <div class="lp-kicker">Infrastructure Review</div>
            <div class="lp-counter">01 / 12</div>

            <!-- title on the horizon -->
            <h1 class="lp-title">On solid <em>ground</em></h1>

            <!-- the horizon -->
            <div class="lp-horizon"></div>
            <div class="lp-sunrise" aria-hidden="true"></div>

            <!-- below the line -->
            <p class="lp-lead">A year of hardening the platform underneath everything — and the proof that it held.</p>
            <div class="lp-meta">
                Engineering All-Hands<br>
                08 Jul 2026<br>
                Jakarta
            </div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
