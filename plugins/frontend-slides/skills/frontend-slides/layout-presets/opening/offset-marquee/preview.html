<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offset Marquee — opening layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   Demo defaults are grayscale placeholders only.
   =========================================== */
.slide.lp {
    --lp-bg: #f1f0ee;
    --lp-fg: #1a1a1a;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(26, 26, 26, 0.13);
    --lp-accent: #7a7a78;
    --lp-line: rgba(26, 26, 26, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === CHROME (top) === */
.lp-kicker {
    position: absolute;
    left: 96px;
    top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-meta {
    position: absolute;
    right: 96px;
    top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-chrome-rule {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 118px;
    height: 1px;
    background: var(--lp-line);
}

/* === GHOST NUMERAL (skin point: may become the system's texture/mark) === */
.lp-ghost {
    position: absolute;
    right: -24px;
    top: 36px;
    font-family: var(--lp-font-display);
    font-weight: 800;
    font-size: 560px;
    line-height: 0.8;
    color: transparent;
    -webkit-text-stroke: 2px var(--lp-fg-faint);
    pointer-events: none;
    z-index: 0;
}

/* === TITLE BLOCK (lower-left anchor) === */
.lp-title-block {
    position: absolute;
    left: 96px;
    bottom: 300px;
    max-width: 1360px;
    z-index: 1;
}
.lp-accent-bar {
    width: 72px;
    height: 8px;
    background: var(--lp-accent);
    margin-bottom: 48px;
    transform-origin: left center;
}
.lp-title {
    margin: 0;
    font-family: var(--lp-font-display);
    font-size: 168px;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-title .lp-line {
    display: block;
}
.lp-title em {
    font-style: normal;
    color: var(--lp-accent);
}
.lp-lead {
    margin: 40px 0 0;
    max-width: 680px;
    font-family: var(--lp-font-body);
    font-size: 26px;
    line-height: 1.5;
    color: var(--lp-fg-muted);
}

/* === FOOTER === */
.lp-foot-rule {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 962px;
    height: 1px;
    background: var(--lp-line);
}
.lp-foot-left,
.lp-foot-right {
    position: absolute;
    top: 984px;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-foot-left { left: 96px; }
.lp-foot-right { right: 96px; }

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(48px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-drift { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.slide.active .lp-kicker,
.slide.active .lp-meta,
.slide.active .lp-chrome-rule { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-ghost { animation: lp-drift 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both; }
.slide.active .lp-accent-bar { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
.slide.active .lp-title .lp-line:nth-child(1) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.40s both; }
.slide.active .lp-title .lp-line:nth-child(2) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.52s both; }
.slide.active .lp-title .lp-line:nth-child(3) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.64s both; }
.slide.active .lp-lead { animation: lp-rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.8s both; }
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.95s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- chrome -->
            <div class="lp-kicker">Quarterly Review</div>
            <div class="lp-meta">FY26 · Q2 — 08 Jul 2026</div>
            <div class="lp-chrome-rule"></div>

            <!-- ghost numeral (behind content) -->
            <div class="lp-ghost" aria-hidden="true">01</div>

            <!-- title block -->
            <div class="lp-title-block">
                <div class="lp-accent-bar"></div>
                <h1 class="lp-title">
                    <span class="lp-line">Where we</span>
                    <span class="lp-line">go <em>next</em></span>
                </h1>
                <p class="lp-lead">Where the platform stands today, what we learned this quarter, and the three bets we are making for the next one.</p>
            </div>

            <!-- footer -->
            <div class="lp-foot-rule"></div>
            <div class="lp-foot-left">A. Rahman — Head of Platform — Nodeflux</div>
            <div class="lp-foot-right">01 / 12</div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
