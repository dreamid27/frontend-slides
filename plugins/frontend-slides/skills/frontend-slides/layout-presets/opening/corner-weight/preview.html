<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corner Weight — opening layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   =========================================== */
.slide.lp {
    --lp-bg: #161616;
    --lp-fg: #ececea;
    --lp-fg-muted: #969694;
    --lp-fg-faint: rgba(255, 255, 255, 0.12);
    --lp-accent: #8f8f8d;
    --lp-line: rgba(255, 255, 255, 0.24);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === TOP-LEFT: TITLE BLOCK === */
.lp-kicker {
    position: absolute; left: 96px; top: 96px;
    font-family: var(--lp-font-mono);
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-title {
    position: absolute; left: 96px; top: 150px;
    margin: 0; max-width: 1100px;
    font-family: var(--lp-font-display);
    font-size: 132px; font-weight: 800;
    line-height: 0.97; letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-title .lp-line { display: block; }
.lp-title em { font-style: normal; color: var(--lp-accent); }
.lp-tail {
    position: absolute; left: 96px; top: 470px;
    width: 200px; height: 1px;
    background: var(--lp-line);
    transform-origin: left center;
}

/* === BOTTOM-RIGHT: PRESENTER CARD ===
   Image variant: this card becomes a 560×420 framed photo card with a
   mono caption below; presenter moves to a line under the kicker. */
.lp-card {
    position: absolute;
    right: 96px; bottom: 96px;
    text-align: right;
}
.lp-card-bar {
    width: 48px; height: 6px;
    background: var(--lp-accent);
    margin: 0 0 24px auto;
    transform-origin: right center;
}
.lp-card-name {
    font-family: var(--lp-font-display);
    font-size: 34px; font-weight: 700;
    color: var(--lp-fg);
}
.lp-card-meta {
    margin-top: 12px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 1.9;
    color: var(--lp-fg-muted);
}

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(48px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.slide.active .lp-kicker { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-title .lp-line:nth-child(1) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-title .lp-line:nth-child(2) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.22s both; }
.slide.active .lp-tail { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both; }
.slide.active .lp-card { animation: lp-rise-sm 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.65s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- top-left: title -->
            <div class="lp-kicker">Board Update</div>
            <h1 class="lp-title">
                <span class="lp-line">The long</span>
                <span class="lp-line"><em>game</em></span>
            </h1>
            <div class="lp-tail" aria-hidden="true"></div>

            <!-- bottom-right: presenter card -->
            <div class="lp-card">
                <div class="lp-card-bar"></div>
                <div class="lp-card-name">A. Rahman</div>
                <div class="lp-card-meta">
                    Head of Platform<br>
                    Nodeflux — 08 Jul 2026<br>
                    01 / 12
                </div>
            </div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
