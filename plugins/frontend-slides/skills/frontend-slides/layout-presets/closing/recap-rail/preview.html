<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recap Rail — closing layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f1f0ee;
    --lp-fg: #1a1a1a;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(26, 26, 26, 0.12);
    --lp-accent: #7a7a78;
    --lp-line: rgba(26, 26, 26, 0.25);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === CHROME === */
.lp-kicker {
    position: absolute; left: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-counter {
    position: absolute; right: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === STATEMENT === */
.lp-statement {
    position: absolute; left: 96px; top: 150px;
    margin: 0; max-width: 1400px;
    font-family: var(--lp-font-display);
    font-size: 116px; font-weight: 800;
    line-height: 0.97; letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-statement em { font-style: normal; color: var(--lp-accent); }

/* === RECAP RAIL ===
   Image variant: past nodes may carry 240×150 thumbnails above the
   track (https://placehold.co/240x150, object-fit cover, CSS fill
   behind). The final ring node never gets one. */
.lp-rail {
    position: absolute;
    left: 96px; right: 96px; top: 560px;
    height: 1px;
}
.lp-track {
    position: absolute; inset: 0;
    background: var(--lp-line);
    transform-origin: left center;
}
.lp-node {
    position: absolute; top: 50%;
    width: 12px; height: 12px;
    margin: -6px 0 0 -6px;
    border-radius: 50%;
    background: var(--lp-fg-muted);
}
.lp-node.p1 { left: 0; }
.lp-node.p2 { left: 25%; }
.lp-node.p3 { left: 50%; }
.lp-node.p4 { left: 75%; }
.lp-node.p5 { left: 100%; }
.lp-node.is-open {
    width: 16px; height: 16px;
    margin: -8px 0 0 -8px;
    background: transparent;
    border: 3px solid var(--lp-accent);
}
.lp-node-label {
    position: absolute; top: 27px;
    width: 240px;
    text-align: center;
    font-family: var(--lp-font-mono);
    font-size: 14px; letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-node-label.p1 { left: 0; text-align: left; width: auto; } /* edge labels align inward */
.lp-node-label.p2 { left: 25%; margin-left: -120px; }
.lp-node-label.p3 { left: 50%; margin-left: -120px; }
.lp-node-label.p4 { left: 75%; margin-left: -120px; }
.lp-node-label.p5 { right: 0; text-align: right; width: auto; }
.lp-node-label.is-open { color: var(--lp-accent); font-weight: 500; }

/* === CODA + FOOTER === */
.lp-coda {
    position: absolute; left: 96px; top: 700px;
    margin: 0; max-width: 1000px;
    font-family: var(--lp-font-body);
    font-size: 24px; line-height: 1.55;
    color: var(--lp-fg-muted);
}
.lp-foot-rule {
    position: absolute; left: 96px; right: 96px; top: 940px;
    height: 1px; background: var(--lp-line);
}
.lp-foot-left, .lp-foot-right {
    position: absolute; top: 962px;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    color: var(--lp-fg-muted);
}
.lp-foot-left { left: 96px; letter-spacing: 0.08em; }
.lp-foot-left .lp-dot { color: var(--lp-accent); margin: 0 14px; }
.lp-foot-right { right: 96px; letter-spacing: 0.12em; text-transform: uppercase; }

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(44px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes lp-pop { from { transform: scale(0); } to { transform: scale(1); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-statement { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-track { animation: lp-wipe 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both; }
.slide.active .lp-node.p1 { animation: lp-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.70s both; }
.slide.active .lp-node.p2 { animation: lp-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.80s both; }
.slide.active .lp-node.p3 { animation: lp-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.90s both; }
.slide.active .lp-node.p4 { animation: lp-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) 1.00s both; }
.slide.active .lp-node.p5 { animation: lp-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) 1.10s both; }
.slide.active .lp-node-label.p1 { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-node-label.p2 { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.95s both; }
.slide.active .lp-node-label.p3 { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.05s both; }
.slide.active .lp-node-label.p4 { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.15s both; }
.slide.active .lp-node-label.p5 { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.25s both; }
.slide.active .lp-coda,
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.2s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- chrome -->
            <div class="lp-kicker">In Closing</div>
            <div class="lp-counter">12 / 12</div>

            <!-- statement -->
            <h1 class="lp-statement">The whole <em>arc.</em></h1>

            <!-- recap rail -->
            <div class="lp-rail" aria-label="Deck recap: Inertia, Depth, Execution, Proof, Next">
                <div class="lp-track"></div>
                <span class="lp-node p1" aria-hidden="true"></span>
                <span class="lp-node p2" aria-hidden="true"></span>
                <span class="lp-node p3" aria-hidden="true"></span>
                <span class="lp-node p4" aria-hidden="true"></span>
                <span class="lp-node p5 is-open" aria-hidden="true"></span>
                <div class="lp-node-label p1">01 Inertia</div>
                <div class="lp-node-label p2">02 Depth</div>
                <div class="lp-node-label p3">03 Execution</div>
                <div class="lp-node-label p4">04 Proof</div>
                <div class="lp-node-label p5 is-open">Next</div>
            </div>

            <!-- coda -->
            <p class="lp-coda">Four parts, one thesis: depth compounds. The open ring is Q3 — and it starts Monday.</p>

            <!-- footer -->
            <div class="lp-foot-rule"></div>
            <div class="lp-foot-left">alfin@nodeflux.io<span class="lp-dot">·</span>nodeflux.io<span class="lp-dot">·</span>@nodeflux</div>
            <div class="lp-foot-right">Nodeflux</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
