<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whisper — closing layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   =========================================== */
.slide.lp {
    --lp-bg: #141414;
    --lp-fg: #e9e9e7;
    --lp-fg-muted: #8f8f8d;
    --lp-fg-faint: rgba(255, 255, 255, 0.12);
    --lp-accent: #8f8f8d;
    --lp-line: rgba(255, 255, 255, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === THE ONLY CHROME === */
.lp-counter {
    position: absolute; right: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
    opacity: 0.7;
}

/* === ACCENT MARK ===
   Image variant: a 96×96 circular presenter portrait replaces this
   mark at the same center (https://placehold.co/192x192 at 2×,
   object-fit cover, 1px ring, CSS fill behind). */
.lp-mark {
    position: absolute;
    left: 50%; top: 472px;
    width: 10px; height: 10px;
    margin-left: -5px;
    background: var(--lp-accent);
}

/* === STATEMENT — one small line === */
.lp-statement {
    position: absolute;
    left: 96px; right: 96px; top: 520px;
    margin: 0;
    text-align: center;
    font-family: var(--lp-font-display);
    font-size: 44px; font-weight: 500;
    line-height: 1.3; letter-spacing: 0;
    color: var(--lp-fg);
}

/* === CONTACT LINE === */
.lp-contact-line {
    position: absolute;
    left: 0; right: 0; top: 960px;
    text-align: center;
    font-family: var(--lp-font-mono);
    font-size: 14px; letter-spacing: 0.08em;
    color: var(--lp-fg-muted);
}
.lp-contact-line .lp-dot { color: var(--lp-accent); margin: 0 16px; }

/* === CHOREOGRAPHY — opacity only; movement is volume === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-fade-dim { from { opacity: 0; } to { opacity: 0.7; } }

.slide.active .lp-mark { animation: lp-fade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
.slide.active .lp-statement { animation: lp-fade 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both; }
.slide.active .lp-contact-line { animation: lp-fade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.3s both; }
.slide.active .lp-counter { animation: lp-fade-dim 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.3s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- the only chrome -->
            <div class="lp-counter">12 / 12</div>

            <!-- accent mark (or 96×96 circular portrait) -->
            <div class="lp-mark" aria-hidden="true"></div>

            <!-- one small line -->
            <p class="lp-statement">Thank you for the hour — it mattered.</p>

            <!-- contact -->
            <div class="lp-contact-line">alfin@nodeflux.io<span class="lp-dot">·</span>@nodeflux</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
