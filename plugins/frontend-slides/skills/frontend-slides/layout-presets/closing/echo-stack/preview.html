<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo Stack — closing layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   Demo defaults are grayscale placeholders only.
   =========================================== */
.slide.lp {
    --lp-bg: #141414;
    --lp-fg: #ededeb;
    --lp-fg-muted: #999997;
    --lp-fg-faint: rgba(255, 255, 255, 0.13);
    --lp-accent: #909090;
    --lp-line: rgba(255, 255, 255, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === CHROME === */
.lp-kicker {
    position: absolute;
    left: 96px;
    top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-counter {
    position: absolute;
    right: 96px;
    top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === ECHO STACK — opacity crescendo, strictly increasing downward === */
.lp-stack {
    position: absolute;
    left: 96px;
    top: 160px;
}
.lp-row {
    display: block;
    font-family: var(--lp-font-display);
    font-size: 140px;
    font-weight: 800;
    line-height: 1.04;
    letter-spacing: -0.02em;
    color: var(--lp-fg);
}
.lp-row:nth-child(1) { opacity: 0.10; }
.lp-row:nth-child(2) { opacity: 0.18; }
.lp-row:nth-child(3) { opacity: 0.32; }
.lp-row:nth-child(4) { opacity: 0.55; }
.lp-row:nth-child(5) { opacity: 1; }
.lp-row .lp-beat {
    color: var(--lp-accent);
    display: inline-block;
}

/* === FOOTER === */
.lp-foot-rule {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 958px;
    height: 1px;
    background: var(--lp-line);
}
.lp-foot-left,
.lp-foot-right {
    position: absolute;
    top: 982px;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--lp-fg-muted);
}
.lp-foot-left { left: 96px; }
.lp-foot-left .lp-dot { color: var(--lp-accent); }
.lp-foot-right {
    right: 96px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
}

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-pop { from { transform: scale(0); } to { transform: scale(1); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
/* rows 1–4 fade to their resting opacity (keyframe has no explicit `to`,
   so each row lands on its own nth-child opacity) */
.slide.active .lp-row:nth-child(1) { animation: lp-fade 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.20s both; }
.slide.active .lp-row:nth-child(2) { animation: lp-fade 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.33s both; }
.slide.active .lp-row:nth-child(3) { animation: lp-fade 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.46s both; }
.slide.active .lp-row:nth-child(4) { animation: lp-fade 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.59s both; }
.slide.active .lp-row:nth-child(5) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both; }
.slide.active .lp-row .lp-beat { animation: lp-pop 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.15s both; }
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.2s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- chrome -->
            <div class="lp-kicker">In Closing</div>
            <div class="lp-counter">12 / 12</div>

            <!-- echo stack -->
            <div class="lp-stack" aria-label="Thank you.">
                <span class="lp-row" aria-hidden="true">Thank you</span>
                <span class="lp-row" aria-hidden="true">Thank you</span>
                <span class="lp-row" aria-hidden="true">Thank you</span>
                <span class="lp-row" aria-hidden="true">Thank you</span>
                <span class="lp-row">Thank you<span class="lp-beat">.</span></span>
            </div>

            <!-- footer -->
            <div class="lp-foot-rule"></div>
            <div class="lp-foot-left">alfin@nodeflux.io <span class="lp-dot">·</span> nodeflux.io <span class="lp-dot">·</span> @nodeflux</div>
            <div class="lp-foot-right">Nodeflux</div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
