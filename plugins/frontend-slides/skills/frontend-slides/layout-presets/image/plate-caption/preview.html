<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plate Caption — image layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   =========================================== */
.slide.lp {
    --lp-bg: #171717;
    --lp-fg: #ebebe9;
    --lp-fg-muted: #979795;
    --lp-fg-faint: rgba(255, 255, 255, 0.12);
    --lp-accent: #8f8f8d;
    --lp-line: rgba(255, 255, 255, 0.24);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === CHROME === */
.lp-kicker {
    position: absolute; left: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-counter {
    position: absolute; right: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === LABEL COLUMN === */
.lp-fig {
    position: absolute; left: 96px; top: 170px;
    font-family: var(--lp-font-mono);
    font-size: 16px; font-weight: 500;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-title {
    position: absolute; left: 96px; top: 230px;
    margin: 0; max-width: 608px;
    font-family: var(--lp-font-display);
    font-size: 76px; font-weight: 800;
    line-height: 1.02; letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-title .lp-line { display: block; }
.lp-title em { font-style: normal; color: var(--lp-accent); }
.lp-reading {
    position: absolute; left: 96px; top: 560px;
    margin: 0; max-width: 560px;
    font-family: var(--lp-font-body);
    font-size: 21px; line-height: 1.6;
    color: var(--lp-fg-muted);
}

/* === PLATE ===
   Recommended: https://placehold.co/1024x780 — fixed frame, object-fit
   cover (switch to contain + matting when exact pixels matter). The
   gradient beneath is the load fallback; the no-image variant fills
   this frame with texture + an oversized outline keyword instead. */
.lp-plate {
    position: absolute; left: 800px; top: 120px;
    width: 1024px; height: 780px;
    border: 1px solid var(--lp-line);
    overflow: hidden;
    background: linear-gradient(140deg, #2c2c2c 0%, #1d1d1d 100%);
}
.lp-plate img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    max-width: none; max-height: none;
    object-fit: cover;
}
.lp-plate-caption {
    position: absolute; left: 800px; top: 924px;
    width: 1024px;
    font-family: var(--lp-font-mono);
    font-size: 13px; letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-settle { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: scale(1); } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-plate { animation: lp-settle 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-plate-caption { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; }
.slide.active .lp-fig { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
.slide.active .lp-title .lp-line:nth-child(1) { animation: lp-rise 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
.slide.active .lp-title .lp-line:nth-child(2) { animation: lp-rise 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.37s both; }
.slide.active .lp-reading { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- chrome -->
            <div class="lp-kicker">Product</div>
            <div class="lp-counter">06 / 14</div>

            <!-- label column -->
            <div class="lp-fig">Fig. 06</div>
            <h2 class="lp-title">
                <span class="lp-line">The console,</span>
                <span class="lp-line">finally <em>whole</em></span>
            </h2>
            <p class="lp-reading">Provisioning, monitoring, and audit in one surface. What used to take three tools and two logins now happens on the screen to the right — this is the build that closed the gap.</p>

            <!-- plate: swap the placeholder src for the real screenshot -->
            <div class="lp-plate">
                <img src="https://placehold.co/1024x780/262626/6a6a68" alt="Unified console screenshot">
            </div>
            <div class="lp-plate-caption">Unified console v2.4 — production, Jakarta region</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
