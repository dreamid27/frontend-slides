<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filmstrip — video layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   =========================================== */
.slide.lp {
    --lp-bg: #171717;
    --lp-fg: #ebebe9;
    --lp-fg-muted: #979795;
    --lp-fg-faint: rgba(255, 255, 255, 0.12);
    --lp-accent: #8f8f8d;
    --lp-line: rgba(255, 255, 255, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === HEADER === */
.lp-kicker {
    position: absolute; left: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-counter {
    position: absolute; right: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-headline {
    position: absolute; left: 96px; top: 118px;
    margin: 0; max-width: 1200px;
    font-family: var(--lp-font-display);
    font-size: 84px; font-weight: 800;
    line-height: 1.02; letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-headline em { font-style: normal; color: var(--lp-accent); }

/* === MAIN PLAYER ===
   Real decks: <video controls poster="..."> or <iframe allowfullscreen>
   at this geometry. Poster placeholder: placehold.co/960x540. */
.lp-player {
    position: absolute; left: 96px; top: 320px;
    width: 960px; height: 540px;
    border: 1px solid var(--lp-line);
    overflow: hidden;
    background: linear-gradient(150deg, #2a2a2a 0%, #1c1c1c 100%);
}
.lp-player img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    max-width: none; max-height: none;
    object-fit: cover;
}
.lp-play {
    position: absolute; left: 50%; top: 50%;
    width: 88px; height: 88px;
    margin: -44px 0 0 -44px;
    border: 1.5px solid rgba(235, 235, 233, 0.9);
    border-radius: 50%;
    background: rgba(23, 23, 23, 0.35);
}
.lp-play::after {
    content: "";
    position: absolute; left: 35px; top: 27px;
    border-left: 28px solid rgba(235, 235, 233, 0.9);
    border-top: 17px solid transparent;
    border-bottom: 17px solid transparent;
}
.lp-caption {
    position: absolute; left: 96px; top: 884px;
    font-family: var(--lp-font-mono);
    font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === UP-NEXT RAIL ===
   Thumb posters: placehold.co/480x270 (2× of the 240×135 frame). */
.lp-rail-label {
    position: absolute; left: 1152px; top: 320px;
    font-family: var(--lp-font-mono);
    font-size: 14px; font-weight: 500;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-rail {
    position: absolute; left: 1152px; right: 96px; top: 370px;
}
.lp-row {
    position: relative;
    display: flex; align-items: center; gap: 24px;
    padding: 20px 0;
}
.lp-row + .lp-row::before {
    content: "";
    position: absolute; left: 0; right: 0; top: 0;
    height: 1px; background: var(--lp-line);
}
.lp-thumb {
    position: relative;
    width: 240px; height: 135px;
    flex: none;
    border: 1px solid var(--lp-line);
    overflow: hidden;
    background: linear-gradient(150deg, #2a2a2a 0%, #1c1c1c 100%);
}
.lp-thumb img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    max-width: none; max-height: none;
    object-fit: cover;
}
.lp-row-title {
    font-family: var(--lp-font-display);
    font-size: 24px; font-weight: 700;
    color: var(--lp-fg);
}
.lp-row-dur {
    margin-top: 8px;
    font-family: var(--lp-font-mono);
    font-size: 13px; letter-spacing: 0.1em;
    color: var(--lp-fg-muted);
}

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-settle { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: scale(1); } }
@keyframes lp-glyph-in { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-headline { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-player { animation: lp-settle 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both; }
.slide.active .lp-play { animation: lp-glyph-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-caption { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.0s both; }
.slide.active .lp-rail-label { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both; }
.slide.active .lp-row:nth-child(1) { animation: lp-rise-sm 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.65s both; }
.slide.active .lp-row:nth-child(2) { animation: lp-rise-sm 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.77s both; }
.slide.active .lp-row:nth-child(3) { animation: lp-rise-sm 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.89s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- header -->
            <div class="lp-kicker">Field Footage</div>
            <div class="lp-counter">09 / 14</div>
            <h2 class="lp-headline">Three sites on <em>tape</em></h2>

            <!-- main player -->
            <div class="lp-player">
                <img src="https://placehold.co/960x540/262626/6a6a68" alt="Jakarta North deployment — poster frame">
                <div class="lp-play" aria-hidden="true"></div>
            </div>
            <div class="lp-caption">Jakarta North — 02:56</div>

            <!-- up-next rail -->
            <div class="lp-rail-label">Up Next</div>
            <div class="lp-rail">
                <div class="lp-row">
                    <div class="lp-thumb"><img src="https://placehold.co/480x270/2b2b2b/6a6a68" alt="Harbor East clip poster"></div>
                    <div>
                        <div class="lp-row-title">Harbor East</div>
                        <div class="lp-row-dur">01:42</div>
                    </div>
                </div>
                <div class="lp-row">
                    <div class="lp-thumb"><img src="https://placehold.co/480x270/2b2b2b/6a6a68" alt="Metro Hub clip poster"></div>
                    <div>
                        <div class="lp-row-title">Metro Hub</div>
                        <div class="lp-row-dur">02:10</div>
                    </div>
                </div>
                <div class="lp-row">
                    <div class="lp-thumb"><img src="https://placehold.co/480x270/2b2b2b/6a6a68" alt="Airport Apron clip poster"></div>
                    <div>
                        <div class="lp-row-title">Airport Apron</div>
                        <div class="lp-row-dur">01:18</div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
