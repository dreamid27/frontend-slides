<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letterbox — video layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f2f1ef;
    --lp-fg: #1b1b1b;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(27, 27, 27, 0.12);
    --lp-accent: #7d7d7b;
    --lp-line: rgba(27, 27, 27, 0.25);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === HEADER === */
.lp-kicker {
    position: absolute; left: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-counter {
    position: absolute; right: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-title {
    position: absolute; left: 96px; top: 150px;
    margin: 0; max-width: 1728px;
    font-family: var(--lp-font-display);
    font-size: 96px; font-weight: 800;
    line-height: 1; letter-spacing: -0.02em;
    text-transform: uppercase;
    white-space: nowrap;
}
.lp-title em { font-style: normal; color: var(--lp-accent); }

/* === CINEMASCOPE BAND ===
   Real decks: <video controls poster="..."> with object-fit: cover
   fills the band and produces the wide crop from 16:9 footage.
   Iframes can't crop: center them at 996×560 and let this band's
   fill show as matting. Poster placeholder: placehold.co/1920x560. */
.lp-band {
    position: absolute; left: 0; right: 0; top: 300px;
    height: 560px;
    overflow: hidden;
    background: linear-gradient(160deg, #d3d2cf 0%, #a9a8a5 100%);
}
.lp-band img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    max-width: none; max-height: none;
    object-fit: cover;
}
.lp-band-edge {
    position: absolute; left: 0; right: 0;
    height: 1px; background: var(--lp-line);
    transform-origin: left center;
    z-index: 2;
}
.lp-band-edge.top { top: 300px; }
.lp-band-edge.bottom { top: 860px; }
.lp-play {
    position: absolute; left: 50%; top: 50%;
    width: 96px; height: 96px;
    margin: -48px 0 0 -48px;
    border: 1.5px solid rgba(27, 27, 27, 0.85);
    border-radius: 50%;
    background: rgba(242, 241, 239, 0.35);
}
.lp-play::after {
    content: "";
    position: absolute; left: 38px; top: 30px;
    border-left: 30px solid rgba(27, 27, 27, 0.85);
    border-top: 18px solid transparent;
    border-bottom: 18px solid transparent;
}

/* === BELOW THE BAND === */
.lp-caption {
    position: absolute; left: 96px; top: 896px;
    font-family: var(--lp-font-mono);
    font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-runtime {
    position: absolute; right: 96px; top: 896px;
    font-family: var(--lp-font-mono);
    font-size: 14px; font-weight: 500;
    letter-spacing: 0.1em;
    color: var(--lp-accent);
}

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-unfold { from { opacity: 0; transform: scaleY(0.85); } to { opacity: 1; transform: scaleY(1); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes lp-glyph-in { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-title { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-band { animation: lp-unfold 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both; }
.slide.active .lp-band-edge { animation: lp-wipe 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both; }
.slide.active .lp-play { animation: lp-glyph-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.95s both; }
.slide.active .lp-caption,
.slide.active .lp-runtime { animation: lp-rise-sm 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.05s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- header -->
            <div class="lp-kicker">Single Take</div>
            <div class="lp-counter">10 / 14</div>
            <h2 class="lp-title">The line, end to <em>end</em></h2>

            <!-- cinemascope band -->
            <div class="lp-band">
                <img src="https://placehold.co/1920x560/c6c5c2/76756f" alt="Sukabumi corridor — poster frame">
                <div class="lp-play" aria-hidden="true"></div>
            </div>
            <div class="lp-band-edge top" aria-hidden="true"></div>
            <div class="lp-band-edge bottom" aria-hidden="true"></div>

            <!-- below the band -->
            <div class="lp-caption">Sukabumi corridor — single take</div>
            <div class="lp-runtime">02:41</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
