<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side Reel — video layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f2f1ef;
    --lp-fg: #1b1b1b;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(27, 27, 27, 0.12);
    --lp-accent: #7d7d7b;
    --lp-line: rgba(27, 27, 27, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === CHROME === */
.lp-kicker {
    position: absolute; left: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-counter {
    position: absolute; right: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === LEFT COLUMN === */
.lp-title {
    position: absolute; left: 96px; top: 170px;
    margin: 0; max-width: 544px;
    font-family: var(--lp-font-display);
    font-size: 72px; font-weight: 800;
    line-height: 1.02; letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-title .lp-line { display: block; }
.lp-title em { font-style: normal; color: var(--lp-accent); }
.lp-reading {
    position: absolute; left: 96px; top: 350px;
    margin: 0; max-width: 500px;
    font-family: var(--lp-font-body);
    font-size: 20px; line-height: 1.55;
    color: var(--lp-fg-muted);
}
.lp-chapters {
    position: absolute; left: 96px; top: 600px;
    width: 544px;
}
.lp-chapter {
    position: relative;
    display: flex; align-items: baseline; gap: 24px;
    padding: 22px 0;
}
.lp-chapter::before {
    content: "";
    position: absolute; left: 0; right: 0; top: 0;
    height: 1px; background: var(--lp-line);
    transform-origin: left center;
}
.lp-chapter-time {
    font-family: var(--lp-font-mono);
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.1em;
    color: var(--lp-accent);
    flex: none;
}
.lp-chapter-beat {
    font-family: var(--lp-font-body);
    font-size: 19px;
    color: var(--lp-fg);
}

/* === PLAYER ===
   Real decks: replace frame contents with <video controls poster="...">
   or an <iframe allowfullscreen> at this geometry.
   Poster placeholder: placehold.co/1088x612; gradient = load fallback. */
.lp-player {
    position: absolute; left: 736px; top: 234px;
    width: 1088px; height: 612px;
    border: 1px solid var(--lp-line);
    overflow: hidden;
    background: linear-gradient(150deg, #d6d5d2 0%, #b0afac 100%);
}
.lp-player img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    max-width: none; max-height: none;
    object-fit: cover;
}
.lp-play {
    position: absolute; left: 50%; top: 50%;
    width: 88px; height: 88px;
    margin: -44px 0 0 -44px;
    border: 1.5px solid rgba(27, 27, 27, 0.85);
    border-radius: 50%;
    background: rgba(242, 241, 239, 0.35);
}
.lp-play::after {
    content: "";
    position: absolute; left: 35px; top: 27px;
    border-left: 28px solid rgba(27, 27, 27, 0.85);
    border-top: 17px solid transparent;
    border-bottom: 17px solid transparent;
}
.lp-caption {
    position: absolute; left: 736px; top: 870px;
    font-family: var(--lp-font-mono);
    font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-settle { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: scale(1); } }
@keyframes lp-glyph-in { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-title .lp-line:nth-child(1) { animation: lp-rise 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-title .lp-line:nth-child(2) { animation: lp-rise 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.22s both; }
.slide.active .lp-reading { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both; }
.slide.active .lp-player { animation: lp-settle 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
.slide.active .lp-play { animation: lp-glyph-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both; }
.slide.active .lp-caption { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both; }
.slide.active .lp-chapter:nth-child(1) { animation: lp-rise-sm 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.65s both; }
.slide.active .lp-chapter:nth-child(2) { animation: lp-rise-sm 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.77s both; }
.slide.active .lp-chapter:nth-child(3) { animation: lp-rise-sm 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.89s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- chrome -->
            <div class="lp-kicker">Product Demo</div>
            <div class="lp-counter">08 / 14</div>

            <!-- left column -->
            <h2 class="lp-title">
                <span class="lp-line">Console,</span>
                <span class="lp-line">in <em>motion</em></span>
            </h2>
            <p class="lp-reading">Three minutes of the unified console doing a full site's day — recorded live, no cuts.</p>

            <div class="lp-chapters">
                <div class="lp-chapter">
                    <span class="lp-chapter-time">00:00</span>
                    <span class="lp-chapter-beat">Cold open — morning provisioning</span>
                </div>
                <div class="lp-chapter">
                    <span class="lp-chapter-time">01:24</span>
                    <span class="lp-chapter-beat">Incident drill, end to end</span>
                </div>
                <div class="lp-chapter">
                    <span class="lp-chapter-time">03:05</span>
                    <span class="lp-chapter-beat">Audit trail, one click</span>
                </div>
            </div>

            <!-- player -->
            <div class="lp-player">
                <img src="https://placehold.co/1088x612/c8c7c4/76756f" alt="Console demo — poster frame">
                <div class="lp-play" aria-hidden="true"></div>
            </div>
            <div class="lp-caption">Unified console v2.4 — recorded Jul 2026</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
