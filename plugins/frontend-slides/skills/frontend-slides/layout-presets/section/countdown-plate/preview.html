<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Plate — section layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   =========================================== */
.slide.lp {
    --lp-bg: #151515;
    --lp-fg: #ececea;
    --lp-fg-muted: #969694;
    --lp-fg-faint: rgba(255, 255, 255, 0.08);
    --lp-accent: #8f8f8d;
    --lp-line: rgba(255, 255, 255, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === CHROME === */
.lp-kicker {
    position: absolute; left: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-counter {
    position: absolute; right: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === NUMERAL PLATE — solid faint, never outline === */
.lp-plate {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-family: var(--lp-font-display);
    font-size: 880px; font-weight: 800;
    line-height: 0.8;
    color: var(--lp-fg-faint);
    pointer-events: none;
    z-index: 0;
}

/* === TITLE — dead center, on top of the plate === */
.lp-title {
    position: absolute; left: 96px; right: 96px; top: 50%;
    transform: translateY(-50%);
    margin: 0;
    text-align: center;
    z-index: 1;
}
.lp-title .lp-word {
    display: inline-block;
    font-family: var(--lp-font-display);
    font-size: 112px; font-weight: 800;
    line-height: 1; letter-spacing: -0.02em;
    text-transform: uppercase;
    color: var(--lp-fg);
}
.lp-title em { font-style: normal; color: var(--lp-accent); }
.lp-sub {
    position: absolute; left: 0; right: 0; top: calc(50% + 100px);
    margin: 0;
    text-align: center;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === CHOREOGRAPHY ===
   Plate and title are transform-centered → animate opacity on the
   blocks and transforms only on inner spans. */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise-word { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

.slide.active .lp-plate { animation: lp-fade 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-title .lp-word { animation: lp-rise-word 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both; }
.slide.active .lp-sub { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.95s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- chrome -->
            <div class="lp-kicker">Part Four</div>
            <div class="lp-counter">10 / 14</div>

            <!-- numeral plate -->
            <div class="lp-plate" aria-hidden="true">04</div>

            <!-- centered title -->
            <h1 class="lp-title"><span class="lp-word"><em>Proof</em></span></h1>
            <p class="lp-sub">The numbers behind the bet</p>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
