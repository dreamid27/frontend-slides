<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypoint — section layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   Demo defaults are grayscale placeholders only.
   =========================================== */
.slide.lp {
    --lp-bg: #f1f0ee;
    --lp-fg: #1a1a1a;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(26, 26, 26, 0.13);
    --lp-accent: #7a7a78;
    --lp-line: rgba(26, 26, 26, 0.25);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === CORNER CHROME === */
.lp-deck-title,
.lp-counter {
    position: absolute;
    top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-deck-title { left: 96px; }
.lp-counter { right: 96px; }

/* === CENTERED TITLE GROUP === */
.lp-part-kicker {
    position: absolute;
    left: 0;
    right: 0;
    top: 300px;
    text-align: center;
    font-family: var(--lp-font-mono);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-title {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 380px;
    margin: 0;
    text-align: center;
    font-family: var(--lp-font-display);
    font-size: 150px;
    font-weight: 800;
    line-height: 0.97;
    letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-title em {
    font-style: normal;
    color: var(--lp-accent);
}

/* === JOURNEY LINE === */
.lp-journey {
    position: absolute;
    left: 0;
    right: 0;
    top: 700px;
    margin: 0 auto;   /* margin centering — keeps transforms free for animation */
    width: 800px;
    height: 1px;
}
.lp-track {
    position: absolute;
    inset: 0;
    background: var(--lp-line);
    transform-origin: left center;
}
.lp-node {
    position: absolute;
    top: 50%;
    width: 10px;
    height: 10px;
    margin: -5px 0 0 -5px; /* self-centering via margins, not transforms */
    border-radius: 50%;
    background: var(--lp-fg-muted);
}
.lp-node.n1 { left: 0; }
.lp-node.n2 { left: 25%; }
.lp-node.n3 { left: 50%; }
.lp-node.n4 { left: 75%; }
.lp-node.n5 { left: 100%; }
.lp-node.is-current {
    width: 16px;
    height: 16px;
    margin: -8px 0 0 -8px;
    background: var(--lp-accent);
}
.lp-node.is-future {
    background: transparent;
    border: 1px solid var(--lp-fg-muted);
    opacity: 0.5;
}
.lp-node-label {
    position: absolute;
    left: 50%;
    top: 29px;
    width: 400px;
    margin-left: -200px; /* margin centering under the current (middle) node */
    text-align: center;
    font-family: var(--lp-font-mono);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--lp-accent);
}

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-fade-half { from { opacity: 0; } to { opacity: 0.5; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(44px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
/* scale-only: opacity stays untouched so dimmed future nodes keep their 0.5 */
@keyframes lp-pop { from { transform: scale(0); } to { transform: scale(1); } }

.slide.active .lp-deck-title,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-part-kicker { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-title { animation: lp-rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
.slide.active .lp-track { animation: lp-wipe 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both; }
.slide.active .lp-node.n1 { animation: lp-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both; }
.slide.active .lp-node.n2 { animation: lp-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.83s both; }
.slide.active .lp-node.n3 { animation: lp-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.91s both; }
.slide.active .lp-node.n4 { animation: lp-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.99s both; }
.slide.active .lp-node.n5 { animation: lp-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) 1.07s both; }
.slide.active .lp-node-label { animation: lp-rise-sm 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.15s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- corner chrome -->
            <div class="lp-deck-title">Where We Go Next</div>
            <div class="lp-counter">06 / 14</div>

            <!-- centered title group -->
            <div class="lp-part-kicker">Part Three of Five</div>
            <h1 class="lp-title">Execution</h1>

            <!-- journey line -->
            <div class="lp-journey" aria-label="Part 3 of 5: Execution">
                <div class="lp-track"></div>
                <span class="lp-node n1" aria-hidden="true"></span>
                <span class="lp-node n2" aria-hidden="true"></span>
                <span class="lp-node n3 is-current" aria-hidden="true"></span>
                <span class="lp-node n4 is-future" aria-hidden="true"></span>
                <span class="lp-node n5 is-future" aria-hidden="true"></span>
                <div class="lp-node-label">Execution</div>
            </div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
