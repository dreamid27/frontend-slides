<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testimony — quote layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f2f1ef;
    --lp-fg: #1b1b1b;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(27, 27, 27, 0.12);
    --lp-accent: #7d7d7b;
    --lp-line: rgba(27, 27, 27, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === CHROME === */
.lp-kicker {
    position: absolute; left: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-counter {
    position: absolute; right: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === QUOTE GLYPH === */
.lp-glyph {
    position: absolute; left: 88px; top: 120px;
    font-family: var(--lp-font-display);
    font-size: 200px; font-weight: 700;
    line-height: 0.7;
    color: var(--lp-accent);
    pointer-events: none;
}

/* === QUOTE === */
.lp-quote {
    position: absolute; left: 96px; top: 330px;
    margin: 0;
    max-width: 1180px; /* 1360px without the portrait */
    font-family: var(--lp-font-display);
    font-size: 64px; font-weight: 600;
    line-height: 1.22; letter-spacing: -0.01em;
    color: var(--lp-fg);
}
.lp-quote em { font-style: normal; color: var(--lp-accent); }

/* === ATTRIBUTION === */
.lp-attr { position: absolute; left: 96px; top: 860px; }
.lp-attr-rule {
    width: 48px; height: 4px;
    background: var(--lp-accent);
    margin-bottom: 24px;
    transform-origin: left center;
}
.lp-attr-name {
    font-family: var(--lp-font-display);
    font-size: 28px; font-weight: 700;
    color: var(--lp-fg);
}
.lp-attr-role {
    margin-left: 20px;
    font-family: var(--lp-font-mono);
    font-size: 14px; letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === PORTRAIT PLATE (optional) ===
   Recommended: https://placehold.co/360x360 — fixed frame + object-fit
   cover absorbs any dimensions; gradient beneath is the load fallback.
   Delete this block for the no-image variant (quote widens to 1360px). */
.lp-portrait {
    position: absolute; left: 1464px; top: 330px;
    width: 360px; height: 360px;
    border: 1px solid var(--lp-line);
    overflow: hidden;
    background: linear-gradient(150deg, #d3d2cf 0%, #a8a7a4 100%);
}
.lp-portrait img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    max-width: none; max-height: none;
    object-fit: cover;
}
.lp-portrait-caption {
    position: absolute; left: 1464px; top: 710px;
    width: 360px;
    font-family: var(--lp-font-mono);
    font-size: 13px; letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-drop { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes lp-settle { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: scale(1); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-glyph { animation: lp-drop 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-quote { animation: lp-rise-sm 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
.slide.active .lp-portrait { animation: lp-settle 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both; }
.slide.active .lp-portrait-caption { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both; }
.slide.active .lp-attr-rule { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-attr-name,
.slide.active .lp-attr-role { animation: lp-rise-sm 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.95s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- chrome -->
            <div class="lp-kicker">Customer Voice</div>
            <div class="lp-counter">08 / 14</div>

            <!-- quote glyph + quote -->
            <div class="lp-glyph" aria-hidden="true">&ldquo;</div>
            <blockquote class="lp-quote">We stopped noticing the platform this year. For infrastructure, <em>that is the highest compliment</em> we know how to give.</blockquote>

            <!-- portrait plate (optional) -->
            <div class="lp-portrait">
                <img src="https://placehold.co/360x360/c2c1be/6f6f6d" alt="Portrait of D. Putri">
            </div>
            <div class="lp-portrait-caption">Harborworks Ops Center</div>

            <!-- attribution -->
            <div class="lp-attr">
                <div class="lp-attr-rule"></div>
                <span class="lp-attr-name">D. Putri</span>
                <span class="lp-attr-role">VP Operations, Harborworks</span>
            </div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
