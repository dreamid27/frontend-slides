<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookmark — section layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f2f1ef;
    --lp-fg: #1b1b1b;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(27, 27, 27, 0.12);
    --lp-accent: #8a8a88;
    --lp-line: rgba(27, 27, 27, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === RIBBON (accent as a surface; the notch sells the bookmark) === */
.lp-ribbon {
    position: absolute; left: 200px; top: 0;
    width: 120px; height: 440px;
    background: var(--lp-accent);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 44px), 0 100%);
}
.lp-ribbon-num {
    position: absolute; left: 0; right: 0; bottom: 76px;
    text-align: center;
    font-family: var(--lp-font-mono);
    font-size: 34px; font-weight: 500;
    color: var(--lp-bg);
}

/* === TITLE BLOCK === */
.lp-title {
    position: absolute; left: 420px; top: 440px;
    margin: 0; max-width: 1300px;
    font-family: var(--lp-font-display);
    font-size: 136px; font-weight: 800;
    line-height: 0.97; letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-title .lp-line { display: block; }
.lp-title em { font-style: normal; color: var(--lp-accent); }
.lp-framing {
    position: absolute; left: 420px; top: 760px;
    margin: 0; max-width: 720px;
    font-family: var(--lp-font-body);
    font-size: 23px; line-height: 1.5;
    color: var(--lp-fg-muted);
}

/* === PART COUNT === */
.lp-count {
    position: absolute; right: 96px; top: 984px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-drop { from { opacity: 0; transform: translateY(-100%); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(48px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.slide.active .lp-ribbon { animation: lp-drop 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-ribbon-num { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both; }
.slide.active .lp-title .lp-line:nth-child(1) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both; }
.slide.active .lp-title .lp-line:nth-child(2) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.47s both; }
.slide.active .lp-framing { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.8s both; }
.slide.active .lp-count { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.95s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- ribbon -->
            <div class="lp-ribbon" aria-hidden="true">
                <div class="lp-ribbon-num">03</div>
            </div>

            <!-- title -->
            <h1 class="lp-title">
                <span class="lp-line">Where the work</span>
                <span class="lp-line">got <em>hard</em></span>
            </h1>
            <p class="lp-framing">The two months nobody wrote home about — and why they mattered most.</p>

            <!-- part count -->
            <div class="lp-count">Part 3 / 5</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
