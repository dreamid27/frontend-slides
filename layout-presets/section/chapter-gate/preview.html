<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter Gate — section layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   Demo defaults are grayscale placeholders only.
   =========================================== */
.slide.lp {
    --lp-bg: #161616;
    --lp-fg: #ececea;
    --lp-fg-muted: #969694;
    --lp-fg-faint: rgba(255, 255, 255, 0.09);
    --lp-accent: #8f8f8d;
    --lp-line: rgba(255, 255, 255, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === KICKER === */
.lp-kicker {
    position: absolute;
    left: 96px;
    top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--lp-accent);
}

/* === CHAPTER NUMERAL — solid faint fill, never an outline === */
.lp-numeral {
    position: absolute;
    right: -40px;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--lp-font-display);
    font-size: 640px;
    font-weight: 800;
    line-height: 0.8;
    color: var(--lp-fg-faint);
    pointer-events: none;
    z-index: 0;
}

/* === TITLE BLOCK (lower-left anchor) === */
.lp-title-block {
    position: absolute;
    left: 96px;
    bottom: 300px;
    max-width: 1150px;
    z-index: 1;
}
.lp-accent-bar {
    width: 72px;
    height: 8px;
    background: var(--lp-accent);
    margin-bottom: 44px;
    transform-origin: left center;
}
.lp-title {
    margin: 0;
    font-family: var(--lp-font-display);
    font-size: 132px;
    font-weight: 800;
    line-height: 0.97;
    letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-title .lp-line {
    display: block;
}
.lp-title em {
    font-style: normal;
    color: var(--lp-accent);
}
.lp-framing {
    margin: 36px 0 0;
    max-width: 680px;
    font-family: var(--lp-font-body);
    font-size: 24px;
    line-height: 1.5;
    color: var(--lp-fg-muted);
}

/* === CHAPTER RAIL === */
.lp-rail-rule {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 940px;
    height: 1px;
    background: var(--lp-line);
}
.lp-rail {
    position: absolute;
    left: 96px;
    top: 966px;
    display: flex;
    gap: 64px;
    font-family: var(--lp-font-mono);
    font-size: 14px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
    z-index: 1;
}
.lp-rail-item {
    display: flex;
    align-items: center;
    gap: 12px;
}
.lp-rail-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--lp-fg-muted);
    flex: none;
}
.lp-rail-item.is-current { color: var(--lp-accent); }
.lp-rail-item.is-current .lp-rail-dot { background: var(--lp-accent); }
.lp-rail-item.is-future { opacity: 0.5; }
.lp-rail-item.is-future .lp-rail-dot {
    background: transparent;
    border: 1px solid var(--lp-fg-muted);
}

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-fade-half { from { opacity: 0; } to { opacity: 0.5; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(44px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes lp-pop { from { transform: scale(0); } to { transform: scale(1); } }

/* numeral is transform-centered: animate opacity only */
.slide.active .lp-numeral { animation: lp-fade 1.0s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-kicker { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both; }
.slide.active .lp-accent-bar { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
.slide.active .lp-title .lp-line:nth-child(1) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both; }
.slide.active .lp-title .lp-line:nth-child(2) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.47s both; }
.slide.active .lp-framing { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; }
.slide.active .lp-rail-rule,
.slide.active .lp-rail-item { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-rail-item.is-future { animation-name: lp-fade-half; }
.slide.active .lp-rail-item.is-current .lp-rail-dot { animation: lp-pop 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- kicker -->
            <div class="lp-kicker">Part Two</div>

            <!-- chapter numeral -->
            <div class="lp-numeral" aria-hidden="true">02</div>

            <!-- title block -->
            <div class="lp-title-block">
                <div class="lp-accent-bar"></div>
                <h1 class="lp-title">
                    <span class="lp-line">Deeper,</span>
                    <span class="lp-line">not <em>wider</em></span>
                </h1>
                <p class="lp-framing">Why we are concentrating the roadmap on two products instead of five.</p>
            </div>

            <!-- chapter rail -->
            <div class="lp-rail-rule"></div>
            <div class="lp-rail">
                <div class="lp-rail-item"><span class="lp-rail-dot"></span>01 Inertia</div>
                <div class="lp-rail-item is-current"><span class="lp-rail-dot"></span>02 Depth</div>
                <div class="lp-rail-item is-future"><span class="lp-rail-dot"></span>03 Execution</div>
                <div class="lp-rail-item is-future"><span class="lp-rail-dot"></span>04 Proof</div>
            </div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
