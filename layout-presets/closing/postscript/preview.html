<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postscript — closing layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f2f1ef;
    --lp-fg: #1b1b1b;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(27, 27, 27, 0.12);
    --lp-accent: #7d7d7b;
    --lp-line: rgba(27, 27, 27, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === CHROME === */
.lp-kicker {
    position: absolute; left: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-counter {
    position: absolute; right: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === LETTER BODY === */
.lp-statement {
    position: absolute; left: 96px; top: 170px;
    margin: 0; max-width: 1300px;
    font-family: var(--lp-font-display);
    font-size: 124px; font-weight: 800;
    line-height: 0.97; letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-statement .lp-line { display: block; }
.lp-statement em { font-style: normal; color: var(--lp-accent); }
.lp-coda {
    position: absolute; left: 96px; top: 480px;
    margin: 0; max-width: 900px;
    font-family: var(--lp-font-body);
    font-size: 26px; line-height: 1.6;
    color: var(--lp-fg-muted);
}

/* === SIGNATURE BLOCK ===
   Image variant: a 300×300 bordered portrait (or 380×110 signature
   scan, borderless) sits at x:820, top-aligned with the accent rule. */
.lp-sig {
    position: absolute; left: 96px; top: 640px;
}
.lp-sig-rule {
    width: 48px; height: 5px;
    background: var(--lp-accent);
    margin-bottom: 28px;
    transform-origin: left center;
}
.lp-sig-name {
    font-family: var(--lp-font-display);
    font-size: 42px; font-weight: 700;
    color: var(--lp-fg);
}
.lp-sig-role {
    margin-top: 10px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === P.S. LINE === */
.lp-ps {
    position: absolute; left: 96px; top: 930px;
    margin: 0; max-width: 1400px;
    font-family: var(--lp-font-body);
    font-size: 24px;
    color: var(--lp-fg);
}
.lp-ps .lp-ps-label {
    font-family: var(--lp-font-mono);
    font-size: 17px; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--lp-accent);
    margin-right: 18px;
}

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(48px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-statement .lp-line:nth-child(1) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-statement .lp-line:nth-child(2) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.22s both; }
.slide.active .lp-coda { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both; }
.slide.active .lp-sig-rule { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; }
.slide.active .lp-sig-name,
.slide.active .lp-sig-role { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-ps { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- chrome -->
            <div class="lp-kicker">In Closing</div>
            <div class="lp-counter">12 / 12</div>

            <!-- letter body -->
            <h1 class="lp-statement">
                <span class="lp-line">That's the</span>
                <span class="lp-line">whole <em>story.</em></span>
            </h1>
            <p class="lp-coda">A year of narrowing focus, and the numbers that followed. Thank you for the trust — and for the hard questions that made the plan better.</p>

            <!-- signature -->
            <div class="lp-sig">
                <div class="lp-sig-rule"></div>
                <div class="lp-sig-name">A. Rahman</div>
                <div class="lp-sig-role">Head of Platform — Nodeflux</div>
            </div>

            <!-- P.S. -->
            <p class="lp-ps"><span class="lp-ps-label">P.S.</span>One ask: read the roadmap doc before Friday's review.</p>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
