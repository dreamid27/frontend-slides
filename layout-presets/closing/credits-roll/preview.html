<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credits Roll — closing layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   =========================================== */
.slide.lp {
    --lp-bg: #141414;
    --lp-fg: #ededeb;
    --lp-fg-muted: #999997;
    --lp-fg-faint: rgba(255, 255, 255, 0.13);
    --lp-accent: #909090;
    --lp-line: rgba(255, 255, 255, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === CHROME === */
.lp-kicker {
    position: absolute; left: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-counter {
    position: absolute; right: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === STATEMENT === */
.lp-statement {
    position: absolute;
    left: 96px; right: 96px; top: 170px;
    margin: 0;
    text-align: center;
    font-family: var(--lp-font-display);
    font-size: 120px; font-weight: 800;
    line-height: 0.97; letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-statement .lp-beat { color: var(--lp-accent); display: inline-block; }

/* === CREDITS BLOCK ===
   Image variant: each row gains a 56×56 photo chip left of the role
   column (all rows or none). */
.lp-credits {
    position: absolute;
    left: 0; right: 0; top: 420px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 48px;
    row-gap: 30px;
    justify-content: center;
}
.lp-role {
    text-align: right;
    align-self: center;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-name {
    text-align: left;
    font-family: var(--lp-font-display);
    font-size: 30px; font-weight: 700;
    color: var(--lp-fg);
}

/* === CONTACT LINE === */
.lp-contact-line {
    position: absolute;
    left: 0; right: 0; top: 940px;
    text-align: center;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.08em;
    color: var(--lp-fg-muted);
}
.lp-contact-line .lp-dot { color: var(--lp-accent); margin: 0 18px; }

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(48px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-xs { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-pop { from { transform: scale(0); } to { transform: scale(1); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-statement { animation: lp-rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-statement .lp-beat { animation: lp-pop 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; }
/* rows enter in pairs (role+name share a delay) — the roll */
.slide.active .lp-credits > :nth-child(-n+2)  { animation: lp-rise-xs 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.50s both; }
.slide.active .lp-credits > :nth-child(n+3):nth-child(-n+4)  { animation: lp-rise-xs 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.60s both; }
.slide.active .lp-credits > :nth-child(n+5):nth-child(-n+6)  { animation: lp-rise-xs 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.70s both; }
.slide.active .lp-credits > :nth-child(n+7):nth-child(-n+8)  { animation: lp-rise-xs 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.80s both; }
.slide.active .lp-credits > :nth-child(n+9):nth-child(-n+10) { animation: lp-rise-xs 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.90s both; }
.slide.active .lp-contact-line { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.2s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- chrome -->
            <div class="lp-kicker">In Closing</div>
            <div class="lp-counter">12 / 12</div>

            <!-- statement -->
            <h1 class="lp-statement">Thank you<span class="lp-beat">.</span></h1>

            <!-- credits -->
            <div class="lp-credits">
                <div class="lp-role">Platform Lead</div><div class="lp-name">A. Rahman</div>
                <div class="lp-role">Edge Models</div><div class="lp-name">S. Wijaya</div>
                <div class="lp-role">Unified Console</div><div class="lp-name">D. Putri</div>
                <div class="lp-role">Site Rollout</div><div class="lp-name">Field Ops Guild</div>
                <div class="lp-role">Reliability</div><div class="lp-name">On-call, all of you</div>
            </div>

            <!-- contact line -->
            <div class="lp-contact-line">alfin@nodeflux.io<span class="lp-dot">·</span>nodeflux.io<span class="lp-dot">·</span>@nodeflux</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
