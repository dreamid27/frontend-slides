<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Frame — closing layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   Demo defaults are grayscale placeholders only.
   (Dark neutral here to show the tokens are role-based,
   not lightness-based — light systems remap the same tokens.)
   =========================================== */
.slide.lp {
    --lp-bg: #161616;
    --lp-fg: #ededed;
    --lp-fg-muted: #9a9a9a;
    --lp-fg-faint: rgba(255, 255, 255, 0.14);
    --lp-accent: #8f8f8f;
    --lp-line: rgba(255, 255, 255, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === FRAME (skin point: system's border vocabulary, same inset) === */
.lp-frame {
    position: absolute;
    inset: 48px;
    border: 1px solid var(--lp-line);
    overflow: hidden; /* clips the ghost echo word — structural */
}

/* === CHROME (inside frame) === */
.lp-kicker {
    position: absolute;
    left: 72px;
    top: 64px;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-counter {
    position: absolute;
    right: 72px;
    top: 64px;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === GHOST ECHO (must bleed past the frame's right edge) === */
.lp-ghost {
    position: absolute;
    right: -140px;
    top: 210px;
    font-family: var(--lp-font-display);
    font-weight: 800;
    font-size: 380px;
    line-height: 0.85;
    text-transform: uppercase;
    color: transparent;
    -webkit-text-stroke: 2px var(--lp-fg-faint);
    pointer-events: none;
    z-index: 0;
}

/* === CLOSING STATEMENT (lower-left anchor) === */
.lp-statement-block {
    position: absolute;
    left: 72px;
    bottom: 232px; /* statement bottom edge ≈ y:690 on stage incl. coda */
    max-width: 1400px;
    z-index: 1;
}
.lp-statement {
    margin: 0;
    font-family: var(--lp-font-display);
    font-size: 176px;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-statement .lp-line {
    display: block;
}
.lp-statement em {
    font-style: normal;
    color: var(--lp-accent);
}
.lp-coda {
    margin: 36px 0 0;
    max-width: 760px;
    font-family: var(--lp-font-body);
    font-size: 24px;
    line-height: 1.5;
    color: var(--lp-fg-muted);
}

/* === CONTACT STRIP (pinned to frame bottom) === */
.lp-contact {
    position: absolute;
    left: 72px;
    right: 72px;
    bottom: 64px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    border-top: 1px solid var(--lp-line);
}
.lp-cell {
    padding: 32px 0 0;
}
.lp-cell + .lp-cell {
    border-left: 1px solid var(--lp-line);
    padding-left: 48px;
}
.lp-cell-label {
    font-family: var(--lp-font-mono);
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
    margin-bottom: 12px;
}
.lp-cell-value {
    font-family: var(--lp-font-body);
    font-size: 24px;
    color: var(--lp-fg);
}

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(56px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-drift { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }

.slide.active .lp-frame { animation: lp-fade 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both; }
.slide.active .lp-ghost { animation: lp-drift 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
.slide.active .lp-statement .lp-line:nth-child(1) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both; }
.slide.active .lp-statement .lp-line:nth-child(2) { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.57s both; }
.slide.active .lp-coda { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-cell:nth-child(1) { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.0s both; }
.slide.active .lp-cell:nth-child(2) { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both; }
.slide.active .lp-cell:nth-child(3) { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.2s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <div class="lp-frame">
                <!-- chrome -->
                <div class="lp-kicker">In Closing</div>
                <div class="lp-counter">12 / 12</div>

                <!-- ghost echo (clipped by frame) -->
                <div class="lp-ghost" aria-hidden="true">Next</div>

                <!-- closing statement -->
                <div class="lp-statement-block">
                    <h1 class="lp-statement">
                        <span class="lp-line">Thank <em>you.</em></span>
                    </h1>
                    <p class="lp-coda">The full report and the roadmap discussed today are linked below — questions welcome anytime.</p>
                </div>

                <!-- contact strip -->
                <div class="lp-contact">
                    <div class="lp-cell">
                        <div class="lp-cell-label">Email</div>
                        <div class="lp-cell-value">alfin@nodeflux.io</div>
                    </div>
                    <div class="lp-cell">
                        <div class="lp-cell-label">Site</div>
                        <div class="lp-cell-value">nodeflux.io</div>
                    </div>
                    <div class="lp-cell">
                        <div class="lp-cell-label">Handle</div>
                        <div class="lp-cell-value">@nodeflux</div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
