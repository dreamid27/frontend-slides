<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Center Seal — closing layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   Demo defaults are grayscale placeholders only.
   =========================================== */
.slide.lp {
    --lp-bg: #151515;
    --lp-fg: #ececea;
    --lp-fg-muted: #969694;
    --lp-fg-faint: rgba(255, 255, 255, 0.13);
    --lp-accent: #8f8f8d;
    --lp-line: rgba(255, 255, 255, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === CORNER CHROME (top corners only) === */
.lp-kicker {
    position: absolute;
    left: 96px;
    top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-counter {
    position: absolute;
    right: 96px;
    top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === RING SEAL (skin point: system's emblem, ≤150px, same center) === */
.lp-seal {
    position: absolute;
    left: 50%;
    top: 280px;
    transform: translateX(-50%);
    width: 140px;
    height: 140px;
    border: 1px solid var(--lp-accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}
.lp-seal-monogram {
    font-family: var(--lp-font-mono);
    font-size: 20px;
    letter-spacing: 0.3em;
    margin-right: -0.3em; /* recenter tracked text */
    text-transform: uppercase;
    color: var(--lp-accent);
}

/* === CENTERED STATEMENT === */
.lp-statement {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 490px;
    margin: 0;
    font-family: var(--lp-font-display);
    font-size: 176px;
    font-weight: 800;
    line-height: 0.98;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    text-align: center;
}
.lp-statement .lp-beat {
    color: var(--lp-accent);
    display: inline-block;
}
.lp-coda {
    position: absolute;
    left: 0;
    right: 0;
    top: 720px;
    width: 720px;
    margin: 0 auto; /* margin centering — a transform here would be
                       overridden by the entrance animation's translateY */
    font-family: var(--lp-font-body);
    font-size: 24px;
    line-height: 1.55;
    text-align: center;
    color: var(--lp-fg-muted);
}

/* === CONTACT LINE === */
.lp-contact-line {
    position: absolute;
    left: 0;
    right: 0;
    top: 900px;
    text-align: center;
    font-family: var(--lp-font-mono);
    font-size: 16px;
    letter-spacing: 0.08em;
    color: var(--lp-fg-muted);
}
.lp-contact-line .lp-dot {
    color: var(--lp-accent);
    margin: 0 20px;
}

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-seal-in { from { opacity: 0; transform: translateX(-50%) scale(0.7); } to { opacity: 1; transform: translateX(-50%) scale(1); } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(48px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-pop { from { transform: scale(0); } to { transform: scale(1); } }

.slide.active .lp-seal { animation: lp-seal-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-seal-monogram { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both; }
.slide.active .lp-statement { animation: lp-rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
.slide.active .lp-statement .lp-beat { animation: lp-pop 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.95s both; }
.slide.active .lp-coda { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both; }
.slide.active .lp-contact-line { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.95s both; }
.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- corner chrome -->
            <div class="lp-kicker">In Closing</div>
            <div class="lp-counter">12 / 12</div>

            <!-- ring seal -->
            <div class="lp-seal" aria-hidden="true">
                <span class="lp-seal-monogram">NF</span>
            </div>

            <!-- statement -->
            <h1 class="lp-statement">Onward<span class="lp-beat">.</span></h1>
            <p class="lp-coda">Ten years in, the mission has not moved an inch — only our reach has. Thank you for carrying it.</p>

            <!-- contact line -->
            <div class="lp-contact-line">alfin@nodeflux.io<span class="lp-dot">·</span>nodeflux.io<span class="lp-dot">·</span>@nodeflux</div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
