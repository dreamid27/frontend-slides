<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticker — stats layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   =========================================== */
.slide.lp {
    --lp-bg: #171717;
    --lp-fg: #ebebe9;
    --lp-fg-muted: #979795;
    --lp-fg-faint: rgba(255, 255, 255, 0.12);
    --lp-accent: #929290;
    --lp-line: rgba(255, 255, 255, 0.26);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === HEADER === */
.lp-kicker {
    position: absolute; left: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-counter {
    position: absolute; right: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-headline {
    position: absolute; left: 96px; top: 118px;
    margin: 0; max-width: 1200px;
    font-family: var(--lp-font-display);
    font-size: 84px; font-weight: 800;
    line-height: 1.02; letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-headline em { font-style: normal; color: var(--lp-accent); }

/* === TICKER BAND ===
   Image variant: a 1200×260 band above the ticker at x:96, y:220
   (placehold.co/1200x260). */
.lp-band-rule {
    position: absolute; left: 0; right: 0;
    height: 1px; background: var(--lp-line);
}
.lp-band-rule.top { top: 520px; transform-origin: left center; }
.lp-band-rule.bottom { top: 760px; transform-origin: right center; }
.lp-cells {
    position: absolute; left: 96px; right: 96px; top: 520px;
    height: 240px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
}
.lp-cell { position: relative; padding-top: 56px; }
.lp-cell + .lp-cell { padding-left: 56px; }
.lp-cell + .lp-cell::before {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 1px; background: var(--lp-line);
    transform-origin: center top;
}
.lp-cell-value {
    font-family: var(--lp-font-display);
    font-size: 104px; font-weight: 800;
    line-height: 0.95; letter-spacing: -0.02em;
    color: var(--lp-fg);
}
.lp-cell-value .lp-unit { color: var(--lp-accent); }
.lp-cell-label {
    margin-top: 20px;
    font-family: var(--lp-font-mono);
    font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === FOOTER === */
.lp-foot-rule {
    position: absolute; left: 96px; right: 96px; top: 962px;
    height: 1px; background: var(--lp-line);
}
.lp-foot-left, .lp-foot-right {
    position: absolute; top: 984px;
    font-family: var(--lp-font-mono);
    font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-foot-left { left: 96px; }
.lp-foot-right { right: 96px; }

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes lp-draw { from { transform: scaleY(0); } to { transform: scaleY(1); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-headline { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-band-rule { animation: lp-wipe 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
.slide.active .lp-cell:nth-child(1) .lp-cell-value { animation: lp-rise-sm 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.65s both; }
.slide.active .lp-cell:nth-child(1) .lp-cell-label { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both; }
.slide.active .lp-cell:nth-child(2)::before { animation: lp-draw 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.79s both; }
.slide.active .lp-cell:nth-child(2) .lp-cell-value { animation: lp-rise-sm 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.79s both; }
.slide.active .lp-cell:nth-child(2) .lp-cell-label { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.89s both; }
.slide.active .lp-cell:nth-child(3)::before { animation: lp-draw 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.93s both; }
.slide.active .lp-cell:nth-child(3) .lp-cell-value { animation: lp-rise-sm 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.93s both; }
.slide.active .lp-cell:nth-child(3) .lp-cell-label { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.03s both; }
.slide.active .lp-cell:nth-child(4)::before { animation: lp-draw 0.35s cubic-bezier(0.16, 1, 0.3, 1) 1.07s both; }
.slide.active .lp-cell:nth-child(4) .lp-cell-value { animation: lp-rise-sm 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.07s both; }
.slide.active .lp-cell:nth-child(4) .lp-cell-label { animation: lp-fade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.17s both; }
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.2s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- header -->
            <div class="lp-kicker">Operations</div>
            <div class="lp-counter">12 / 14</div>
            <h2 class="lp-headline">The operation, at a <em>glance</em></h2>

            <!-- ticker band -->
            <div class="lp-band-rule top" aria-hidden="true"></div>
            <div class="lp-band-rule bottom" aria-hidden="true"></div>
            <div class="lp-cells">
                <div class="lp-cell">
                    <div class="lp-cell-value">214</div>
                    <div class="lp-cell-label">Deploys</div>
                </div>
                <div class="lp-cell">
                    <div class="lp-cell-value">38<span class="lp-unit">ms</span></div>
                    <div class="lp-cell-label">P99</div>
                </div>
                <div class="lp-cell">
                    <div class="lp-cell-value">99.98<span class="lp-unit">%</span></div>
                    <div class="lp-cell-label">Uptime</div>
                </div>
                <div class="lp-cell">
                    <div class="lp-cell-value">12</div>
                    <div class="lp-cell-label">Regions</div>
                </div>
            </div>

            <!-- footer -->
            <div class="lp-foot-rule"></div>
            <div class="lp-foot-left">Platform telemetry — Q2 FY26</div>
            <div class="lp-foot-right">Nodeflux</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
