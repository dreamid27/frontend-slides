<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ratio Split — stats layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   =========================================== */
.slide.lp {
    --lp-bg: #151515;
    --lp-fg: #ececea;
    --lp-fg-muted: #7c7c7a;
    --lp-fg-faint: rgba(255, 255, 255, 0.12);
    --lp-accent: #a8a8a6;
    --lp-line: rgba(255, 255, 255, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === HEADER === */
.lp-kicker {
    position: absolute; left: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-counter {
    position: absolute; right: 96px; top: 72px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-headline {
    position: absolute; left: 96px; top: 118px;
    margin: 0;
    font-family: var(--lp-font-display);
    font-size: 72px; font-weight: 800;
    line-height: 1.02; letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-headline em { font-style: normal; color: var(--lp-accent); }

/* === BEFORE (muted — the past doesn't move) === */
.lp-before {
    position: absolute; left: 96px; top: 400px;
    font-family: var(--lp-font-display);
    font-size: 220px; font-weight: 800;
    line-height: 0.9; letter-spacing: -0.03em;
    color: var(--lp-fg-muted);
}
.lp-before-label {
    position: absolute; left: 96px; top: 660px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === ARROW + DELTA === */
.lp-arrow {
    position: absolute; left: 850px; top: 498px;
    width: 220px; height: 3px;
    background: var(--lp-accent);
    transform-origin: left center;
}
.lp-arrow-head {
    position: absolute; left: 1070px; top: 486px;
    border-left: 22px solid var(--lp-accent);
    border-top: 14px solid transparent;
    border-bottom: 14px solid transparent;
}
.lp-delta {
    position: absolute; left: 850px; top: 548px;
    width: 242px;
    text-align: center;
    font-family: var(--lp-font-mono);
    font-size: 22px; font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--lp-accent);
}

/* === AFTER (full contrast) === */
.lp-after {
    position: absolute; right: 96px; top: 400px;
    text-align: right;
    font-family: var(--lp-font-display);
    font-size: 220px; font-weight: 800;
    line-height: 0.9; letter-spacing: -0.03em;
    color: var(--lp-fg);
}
.lp-after .lp-unit { color: var(--lp-accent); }
.lp-after-label {
    position: absolute; right: 96px; top: 660px;
    text-align: right;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === FOOTER === */
.lp-foot-rule {
    position: absolute; left: 96px; right: 96px; top: 962px;
    height: 1px; background: var(--lp-line);
}
.lp-foot-left, .lp-foot-right {
    position: absolute; top: 984px;
    font-family: var(--lp-font-mono);
    font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-foot-left { left: 96px; }
.lp-foot-right { right: 96px; }

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(48px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes lp-pop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }

.slide.active .lp-kicker,
.slide.active .lp-counter { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-headline { animation: lp-rise-sm 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
.slide.active .lp-before,
.slide.active .lp-before-label { animation: lp-fade 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both; }
.slide.active .lp-arrow { animation: lp-wipe 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both; }
.slide.active .lp-arrow-head { animation: lp-pop 0.3s cubic-bezier(0.16, 1, 0.3, 1) 1.0s both; }
.slide.active .lp-after { animation: lp-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.95s both; }
.slide.active .lp-after-label { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.15s both; }
.slide.active .lp-delta { animation: lp-pop 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.25s both; }
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.25s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- header -->
            <div class="lp-kicker">Latency</div>
            <div class="lp-counter">11 / 14</div>
            <h2 class="lp-headline">P99, two quarters <em>apart</em></h2>

            <!-- before -->
            <div class="lp-before">91ms</div>
            <div class="lp-before-label">Q1 baseline</div>

            <!-- arrow + delta -->
            <div class="lp-arrow" aria-hidden="true"></div>
            <div class="lp-arrow-head" aria-hidden="true"></div>
            <div class="lp-delta">−58%</div>

            <!-- after -->
            <div class="lp-after">38<span class="lp-unit">ms</span></div>
            <div class="lp-after-label">Q2, after the scheduler rewrite</div>

            <!-- footer -->
            <div class="lp-foot-rule"></div>
            <div class="lp-foot-left">Platform telemetry — FY26</div>
            <div class="lp-foot-right">Nodeflux</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
