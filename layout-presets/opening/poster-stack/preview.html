<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poster Stack — opening layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden; display: block;
    visibility: hidden; opacity: 0; pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   =========================================== */
.slide.lp {
    --lp-bg: #f1f0ee;
    --lp-fg: #1a1a1a;
    --lp-fg-muted: #6f6f6d;
    --lp-fg-faint: rgba(26, 26, 26, 0.12);
    --lp-accent: #8a8a88;
    --lp-line: rgba(26, 26, 26, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === MARGIN CHROME === */
.lp-kicker {
    position: absolute; left: 96px; top: 64px;
    font-family: var(--lp-font-mono);
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--lp-accent);
}
.lp-meta {
    position: absolute; right: 96px; top: 64px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === THE STACK ===
   Row pattern is fixed: solid / outline / solid / accent.
   Image variant: the outline row becomes a letterbox image band
   (object-fit cover, full row footprint), caption chip at its right. */
.lp-stack {
    position: absolute;
    left: 96px; right: 96px; top: 150px;
}
.lp-row {
    display: block;
    font-family: var(--lp-font-display);
    font-size: 170px; font-weight: 800;
    line-height: 1.09; letter-spacing: -0.02em;
    text-transform: uppercase;
    color: var(--lp-fg);
}
.lp-row.r-outline {
    color: transparent;
    -webkit-text-stroke: 2px rgba(26, 26, 26, 0.55);
}
.lp-row.r-accent { color: var(--lp-accent); }

/* === FOOTER === */
.lp-foot-rule {
    position: absolute;
    left: 96px; right: 96px; top: 940px;
    height: 1px; background: var(--lp-line);
}
.lp-foot-left, .lp-foot-right {
    position: absolute; top: 962px;
    font-family: var(--lp-font-mono);
    font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-foot-left { left: 96px; }
.lp-foot-right { right: 96px; }

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-accent-in { from { color: var(--lp-fg); } to { color: var(--lp-accent); } }

.slide.active .lp-row:nth-child(1) { animation: lp-rise 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-row:nth-child(2) { animation: lp-rise 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.11s both; }
.slide.active .lp-row:nth-child(3) { animation: lp-rise 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.22s both; }
.slide.active .lp-row:nth-child(4) { animation: lp-rise 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.33s both,
                                                lp-accent-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both; }
.slide.active .lp-kicker,
.slide.active .lp-meta,
.slide.active .lp-foot-rule,
.slide.active .lp-foot-left,
.slide.active .lp-foot-right { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.95s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- margin chrome -->
            <div class="lp-kicker">Annual Briefing</div>
            <div class="lp-meta">08 Jul 2026</div>

            <!-- the stack -->
            <h1 class="lp-stack">
                <span class="lp-row">State</span>
                <span class="lp-row r-outline">of the</span>
                <span class="lp-row">platform</span>
                <span class="lp-row r-accent">2026</span>
            </h1>

            <!-- footer -->
            <div class="lp-foot-rule"></div>
            <div class="lp-foot-left">A. Rahman — Nodeflux</div>
            <div class="lp-foot-right">01 / 12</div>
        </section>
    </div>
</div>
<script>
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
