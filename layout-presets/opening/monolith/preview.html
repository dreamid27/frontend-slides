<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monolith — opening layout demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}
.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
img, video, canvas, svg {
    max-width: 100%;
    max-height: 100%;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

/* ===========================================
   NEUTRAL TOKEN CONTRACT — remap per design system.
   Demo defaults are grayscale placeholders only.
   =========================================== */
.slide.lp {
    --lp-bg: #151515;
    --lp-fg: #ececea;
    --lp-fg-muted: #969694;
    --lp-fg-faint: rgba(255, 255, 255, 0.13);
    --lp-accent: #8f8f8d;
    --lp-line: rgba(255, 255, 255, 0.22);
    --lp-font-display: 'Archivo', sans-serif;
    --lp-font-body: 'Archivo', sans-serif;
    --lp-font-mono: 'IBM Plex Mono', monospace;
    background: var(--lp-bg);
    color: var(--lp-fg);
}

/* === CORNERS === */
.lp-corner {
    position: absolute;
    font-family: var(--lp-font-mono);
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}
.lp-corner.tl { left: 96px; top: 72px; letter-spacing: 0.18em; font-weight: 500; color: var(--lp-accent); }
.lp-corner.tr { right: 96px; top: 72px; }
.lp-corner.bl { left: 96px; top: 984px; }
.lp-corner.br { right: 96px; top: 984px; }

/* === PLUMB LINE (skin point: system's linear device, same axis) === */
.lp-plumb {
    position: absolute;
    left: 959px;
    top: 0;
    width: 2px;
    height: 210px;
    background: var(--lp-accent);
    transform-origin: top center;
}

/* === CENTERED TITLE BLOCK === */
.lp-title-block {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 50%;
    transform: translateY(-52%);
    text-align: center;
}
.lp-title {
    margin: 0;
    font-family: var(--lp-font-display);
    font-size: 200px;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.02em;
    text-transform: uppercase;
}
.lp-title .lp-line {
    display: block;
}
.lp-title em {
    font-style: normal;
    color: var(--lp-accent);
}
.lp-inscription {
    margin: 56px 0 0;
    font-family: var(--lp-font-mono);
    font-size: 16px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--lp-fg-muted);
}

/* === CHOREOGRAPHY === */
@keyframes lp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes lp-rise-scale { from { opacity: 0; transform: translateY(40px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes lp-rise-sm { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes lp-draw { from { transform: scaleY(0); } to { transform: scaleY(1); } }

.slide.active .lp-plumb { animation: lp-draw 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0s both; }
.slide.active .lp-title .lp-line:nth-child(1) { animation: lp-rise-scale 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
.slide.active .lp-title .lp-line:nth-child(2) { animation: lp-rise-scale 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.42s both; }
.slide.active .lp-inscription { animation: lp-rise-sm 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both; }
.slide.active .lp-corner { animation: lp-fade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.0s both; }
</style>
</head>
<body>
<div class="deck-viewport">
    <div class="deck-stage">
        <section class="slide lp active">
            <!-- corners -->
            <div class="lp-corner tl">Annual Letter</div>
            <div class="lp-corner tr">08 Jul 2026</div>
            <div class="lp-corner bl">A. Rahman — Nodeflux</div>
            <div class="lp-corner br">01 / 14</div>

            <!-- plumb line -->
            <div class="lp-plumb" aria-hidden="true"></div>

            <!-- centered title -->
            <div class="lp-title-block">
                <h1 class="lp-title">
                    <span class="lp-line">Ten years</span>
                    <span class="lp-line"><em>deeper</em></span>
                </h1>
                <p class="lp-inscription">A letter to the team on the decade ahead</p>
            </div>
        </section>
    </div>
</div>
<script>
// Uniform fixed-stage scaler: scale the 1920×1080 stage to fit the viewport.
(function () {
    var stage = document.querySelector('.deck-stage');
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var x = (window.innerWidth - 1920 * s) / 2;
        var y = (window.innerHeight - 1080 * s) / 2;
        stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
